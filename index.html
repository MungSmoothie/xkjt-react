mily: monospace; font-size: 13px;\">\n    <div style=\"background:#8b2635; color:#fff; padding: 8px 16px; border-radius: 4px; display: inline-block; margin: 4px;\">GitHub main 分支</div>\n    <div style=\"color:#888; \n<p style=\"color:#999;text-align:center;padding:20px\">[内容已截断，原文件见 /小动物科研培训平台/ ]</p></div>", "icon": "👥"}, {"num": 12, "title": "直播功能", "html": "<div class=\"wrap\">\n\n<!-- 报头 -->\n<div class=\"hdr\">\n  <div class=\"sub\"><span class=\"tag\">附加调研</span>村口情报社 · 2026年3月26日</div>\n  <h1>小动物科研培训平台 — 直播功能详细方案</h1>\n  <div class=\"sub\">技术选型 · 腾讯云 CSS · 推拉流 · 播放器 · 弹幕互动 · 合规要求 · 成本估算</div>\n</div>\n\n<!-- 概述 -->\n<div class=\"card\">\n  <h2>一、概述：直播在产品中的定位</h2>\n  <p>直播是这个培训平台的核心互动场景，主要用途有三个：</p>\n  <ul>\n    <li><strong>专家答疑课：</strong>定期请三甲医院影像科医生、实验动物专家在线直播讲课，学生实时提问</li>\n    <li><strong>操作演示课：</strong>超声设备/智能笼实操演示，边做边讲，比录播更有临场感</li>\n    <li><strong>新课上架直播：</strong>新课程发布时做首发直播，起到营销推广作用</li>\n  </ul>\n  <div class=\"info\">\n    <strong>关键约束：</strong>做网站版（不做小程序），<strong>无需申请微信 live-player 类目</strong>，直接集成腾讯云 CSS 即可开播。网站版不受微信审核限制，比小程序灵活得多。\n  </div>\n</div>\n\n<!-- 协议基础 -->\n<div class=\"card\">\n  <h2>二、直播协议生态（扫盲）</h2>\n  <p>直播涉及三个核心协议，理解它们的关系才能选对技术方案：</p>\n\n  <h3>2.1 推流协议（从主播端到云端）</h3>\n  <table>\n    <tr><th>协议</th><th>全称</th><th>延迟</th><th>画质</th><th>适用场景</th><th>工具</th></tr>\n    <tr><td><strong>RTMP</strong></td><td>Real-Time Messaging Protocol</td><td>1-3秒</td><td>可支持高码率</td><td>主流推流协议，OBS默认</td><td>OBS / 腾讯云控制台</td></tr>\n    <tr><td><strong>SRT</strong></td><td>Secure Reliable Transport</td><td>延迟更低</td><td>更高</td><td>海外推流或高质量需求</td><td>OBS（需配置）</td></tr>\n    <tr><td><strong>WebRTC</strong></td><td>Web Real-Time Communication</td><td><span class=\"bdg bdg-g\">极低（0.5s内）</span></td><td>中等</td><td>实时互动场景（连麦）</td><td>浏览器原生支持</td></tr>\n  </table>\n\n  <h3>2.2 拉流协议（从云端到用户端）</h3>\n  <table>\n    <tr><th>协议</th><th>全称</th><th>延迟</th><th>适配性</th><th>防盗能力</th><th>推荐度</th></tr>\n    <tr><td><strong>FLV</strong></td><td>Adobe Flash Video</td><td>2-5秒</td><td>PC浏览器（需flv.js）</td><td>一般</td><td><span class=\"bdg bdg-y\">备选</span></td></tr>\n    <tr><td><strong>HLS</strong></td><td>HTTP Live Streaming（Apple）</td><td>5-15秒</td><td><span class=\"bdg bdg-g\">最优</span> 全平台支持</td><td>可叠加DRM加密</td><td><span class=\"bdg bdg-g\">推荐</span></td></tr>\n    <tr><td><strong>WebRTC</strong></td><td>Web Real-Time Communication</td><td><span class=\"bdg bdg-g\">极低（0.5s内）</td><td>PC浏览器（需Chrome/Firefox）</td><td>中等</td><td><span class=\"bdg bdg-y\">连麦专用</span></td></tr>\n    <tr><td><strong>DASH</strong></td><td>Dynamic Adaptive Streaming</td><td>5-15秒</td><td>欧美主流，国内弱</td><td>可叠加DRM</td><td><span class=\"bdg bdg-r\">不推荐国内</span></td></tr>\n  </table>\n\n  <h3>2.3 推荐组合</h3>\n  <div class=\"proto\">\n    <div class=\"proto-step\">主播推流（RTMP）</div>\n    <div class=\"proto-arrow\">→</div>\n    <div class=\"proto-step\">腾讯云 CSS</div>\n    <div class=\"proto-arrow\">→</div>\n    <div class=\"proto-step\">转码（HLS+FLV）</div>\n    <div class=\"proto-arrow\">→</div>\n    <div class=\"proto-step\">用户拉流</div>\n  </div>\n  <div class=\"info\">\n    <strong>结论：</strong>推流用 RTMP（OBS 默认支持），拉流用 <strong>HLS 优先 + FLV 兜底</strong>（flv.js 自动降级）。腾讯云 CSS 会自动把 RTMP 流转成 HLS/FLV，分发给用户。\n  </div>\n</div>\n\n<!-- 腾讯云 CSS 接入 -->\n<div class=\"card\">\n  <h2>三、腾讯云 CSS 接入（核心）</h2>\n\n  <h3>3.1 CSS 核心概念</h3>\n  <table>\n    <tr><th>概念</th><th>说明</th><th>示例</th></tr>\n    <tr><td>推流地址（RTMP）</td><td>主播推到腾讯云的地址，含 AppName 和 StreamName</td><td><code>rtmp://push.example.com/live/stream_123</code></td></tr>\n    <tr><td>播放地址（拉流）</td><td>用户从腾讯云拉取的地址</td><td><code>https://pull.example.com/live/stream_123.flv</code></td></tr>\n    <tr><td>StreamName（流ID）</td><td>唯一标识一场直播的ID</td><td><code>course_20260326_001</code></td></tr>\n    <tr><td>推流凭证（SP）</td><td>防止推流地址被滥用，有效期可设置</td><td>自动生成，含时间戳签名</td></tr>\n    <tr><td>直播码（LiveCode）</td><td>腾讯云给频道分配的ID</td><td>系统生成</td></tr>\n  </table>\n\n  <h3>3.2 推流地址生成规则</h3>\n  <p>直播开始前，后端需要生成一个临时的推流地址，有效期一般设为直播时长 + 30分钟缓冲：</p>\n  <pre>推流地址 = rtmp://[域名]/[AppName]/[StreamName]?txSecret=[签名]&amp;txTime=[过期时间]</pre>\n  <p>签名算法（MD5）：</p>\n  <pre>txSecret = MD5(key + StreamName + txTime)\n# key = 腾讯云控制台配置的推流密钥\n# txTime = 十六进制 Unix 时间戳（毫秒）</pre>\n\n  <h3>3.3 直播频道管理（后端接口）</h3>\n  <table>\n    <tr><th>接口</th><th>方法</th><th>说明</th></tr>\n    <tr><td><code>POST /api/live/create</code></td><td>创建频道</td><td>输入：课程ID、开播时间、预计时长；输出：推流地址、播放地址、StreamName</td></tr>\n    <tr><td><code>GET /api/live/:id</code></td><td>获取频道信息</td><td>输出：推流状态（未开播/直播中/已结束）、在线人数、播放地址</td></tr>\n    <tr><td><code>POST /api/live/:id/start</code></td><td>开始直播</td><td>主播确认开播，推流地址生效</td></tr>\n    <tr><td><code>POST /api/live/:id/stop</code></td><td>结束直播</td><td>主播主动停播或超自动断流</td></tr>\n    <tr><td><code>GET /api/live/:id/stream-key</code></td><td>获取推流密钥</td><td>返回临时推流地址（含签名+过期时间）</td></tr>\n  </table>\n\n  <h3>3.4 直播状态机</h3>\n  <div class=\"step\"><div class=\"step-n\">1</div><div class=\"step-text\"><strong>预约状态</strong> — 用户可预约，收到开播提醒；主播未推流</div></div>\n  <div class=\"step\"><div class=\"step-n\">2</div><div class=\"step-text\"><strong>开播前等待</strong> — 距离开播 &lt; 10分钟，显示\"即将开始\"；推流地址已生成</div></div>\n  <div class=\"step\"><div class=\"step-n\">3</div><div class=\"step-text\"><strong>直播中</strong> — 主播推流中；用户可观看；弹幕互动开启</div></div>\n  <div class=\"step\"><div class=\"step-n\">4</div><div class=\"step-text\"><strong>直播结束</strong> — 自动断流；生成录制文件到 VOD；生成回放页面</div></div>\n  <div class=\"step\"><div class=\"step-n\">5</div><div class=\"step-text\"><strong>回放上线</strong> — 录制件转码完成后，用户可在课程页看回放</div></div>\n\n  <div class=\"warn\">\n    <strong>自动断流规则：</strong>腾讯云 CSS 有\"空闲自动断流\"机制，如果 10-15 分钟没有收到推流会自动结束直播。长时间停顿（比如专家喝水）要跟观众说一声，避免断流。\n  </div>\n</div>\n\n<!-- OBS 推流设置 -->\n<div class=\"card\">\n  <h2>四、主播端：OBS 推流设置</h2>\n\n  <h3>4.1 OBS 推荐配置（培训场景）</h3>\n  <table>\n    <tr><th>参数</th><th>推荐值</th><th>说明</th></tr>\n    <tr><td>输出分辨率</td><td>1920×1080</td><td>高清授课，文件体积适中</td></tr>\n    <tr><td>帧率</td><td>25-30 fps</td><td>医学演示不需要 60fps，25fps 够用且省带宽</td></tr>\n    <tr><td>视频编码器</td><td>H.264（NVENC硬件编码）</td><td>如果有 NVIDIA 显卡用硬编，CPU 占用低</td></tr>\n    <tr><td>码率（视频）</td><td>2500-4000 kbps</td><td>1080p 建议 3000kbps，720p 建议 1500kbps</td></tr>\n    <tr><td>音频编码</td><td>AAC-LC</td><td>码率 128kbps，44100Hz 立体声</td></tr>\n    <tr><td>关键帧间隔</td><td>2秒</td><td>HLS 延迟主要取决于此，设置短延迟低</td></tr>\n    <tr><td>场景设置</td><td>多场景切换</td><td>场景1=摄像头，场景2=PPT+摄像头，场景3=全屏PPT</td></tr>\n  </table>\n\n  <h3>4.2 OBS 推流地址配置</h3>\n  <div class=\"step\"><div class=\"step-n\">1</div><div class=\"step-text\">在平台\"直播管理\"后台创建频道，复制推流地址（格式：<code>rtmp://[域名]/live/streamname?签名</code>）</div></div>\n  <div class=\"step\"><div class=\"step-n\">2</div><div class=\"step-text\">OBS → 设置 → 推流 → 服务选\"自定义\"，粘贴完整推流地址</div></div>\n  <div class=\"step\"><div class=\"step-n\">3</div><div class=\"step-text\">点击\"开始推流\"，腾讯云后台会自动识别直播状态为\"直播中\"</div></div>\n  <div class=\"step\"><div class=\"step-n\">4</div><div class=\"step-text\">直播结束，点击\"停止推流\"，腾讯云自动录制</div></div>\n\n  <h3>4.3 设备推荐（主播端）</h3>\n  <table>\n    <tr><th>场景</th><th>推荐设备</th><th>说明</th></tr>\n    <tr><td>单人授课</td><td>罗技 C920 / C922 USB摄像头</td><td>够用，1080p 30fps，USB即插即用</td></tr>\n    <tr><td>专业演示</td><td>索尼 A7M4 / 佳能 EOS R6（视频采集卡）</td><td>示教效果更好，但成本高</td></tr>\n    <tr><td>屏幕录制</td><td>NVIDIA NVENC 编码</td><td>PPT + 摄像头双画面，CPU 0占用</td></tr>\n    <tr><td>提词器</td><td>OBS 的\"隐藏式字幕\"插件或独立提词软件</td><td>专家不需要低头看稿</td></tr>\n  </table>\n</div>\n\n<!-- 播放器实现 -->\n<div class=\"card\">\n  <h2>五、用户端：播放器实现（网站）</h2>\n\n  <h3>5.1 推荐方案：flv.js + HLS.js 自动降级</h3>\n  <p>flv.js 是 B 站开源的纯 JS 库，可以在浏览器里解析 FLV 流，不需要 Flash。</p>\n\n  <pre>// 播放器初始化伪代码\nconst player = document.getElementById('player');\n\n// 优先尝试 FLV（延迟低）\nif (flvjs.isSupported()) {\n  const flvPlayer = flvjs.createPlayer({\n    type: 'flv',\n    url: 'https://pull.example.com/live/stream_123.flv',\n    hasAudio: true,\n    hasVideo: true,\n  });\n  flvPlayer.attachMediaElement(player);\n  flvPlayer.load();\n  flvPlayer.play();\n}\n// 如果不支持 FLV，降级到 HLS\nelse if (Hls.isSupported()) {\n  const hlsPlayer = new Hls({ defaultEpsilon: 0.5 });\n  hlsPlayer.loadSource('https://pull.example.com/live/stream_123.m3u8');\n  hlsPlayer.attachMedia(player);\n  hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => hlsPlayer.startLoad());\n}\n// 完全不支持，降级到浏览器原生 video 标签（HLS直连）\nelse {\n  player.src = 'https://pull.example.com/live/stream_123.m3u8';\n}\n</pre>\n\n  <h3>5.2 播放器 UI 功能要求</h3>\n  <table>\n    <tr><th>功能</th><th>实现方式</th><th>优先级</th></tr>\n    <tr><td>自适应码率（ABR）</td><td>HLS/DASH自适应，用户带宽自适应切换480p/720p/1080p</td><td><span class=\"bdg bdg-r\">必须</span></td></tr>\n    <tr><td>倍速播放</td><td>0.5x / 0.75x / 1x / 1.25x / 1.5x / 2x</td><td><span class=\"bdg bdg-r\">必须</span></td></tr>\n    <tr><td>进度保存</td><td>每10秒记录到后端，用户换设备可续播</td><td><span class=\"bdg bdg-r\">必须</span></td></tr>\n    <tr><td>弹幕互动</td><td>flv.js播放同时 WebSocket 接收弹幕，叠加在视频上</td><td><span class=\"bdg bdg-y\">建议</span></td></tr>\n    <tr><td>跑马灯水印</td><td>Canvas 叠加用户ID+时间戳，录屏可溯源</td><td><span class=\"bdg bdg-r\">必须</span></td></tr>\n    <tr><td> DRM 加密播放</td><td>腾讯云 VOD 私有加密，播放时需签名解密</td><td><span class=\"bdg bdg-y\">建议</span></td></tr>\n    <tr><td>清晰度切换</td><td>手动选择 480p / 720p / 1080p（不建议自动）</td><td><span class=\"bdg bdg-g\">可选</span></td></tr>\n  </table>\n\n  <h3>5.3 跑马灯水印实现（防录屏溯源）</h3>\n  <pre>// Canvas 叠加层，每帧渲染\nconst canvas = document.getElementById('watermark');\nconst ctx = canvas.getContext('2d');\nconst userId = '用户ID: ' + currentUser.id;\nconst ts = new Date().toLocaleString();\n\nfunction drawWatermark() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  ctx.font = '16px sans-serif';\n  ctx.fillStyle = 'rgba(255,255,255,0.15)';\n  ctx.fillText(userId, Math.random()*300, Math.random()*50+20);\n  ctx.fillText(ts, Math.random()*300, Math.random()*50+50);\n  if (isLive) requestAnimationFrame(drawWatermark);\n}</pre>\n  <div class=\"warn\">\n    <strong>重要：</strong>跑马灯水印必须叠加在视频层之上、弹幕层之下。水印文字要包含用户注册手机号后4位，方便溯源。录屏能看清水印，但正常观看时不干扰画面。\n  </div>\n</div>\n\n<!-- 弹幕系统 -->\n<div class=\"card\">\n  <h2>六、弹幕互动系统</h2>\n\n  <h3>6.1 技术架构</h3>\n  <div class=\"proto\">\n    <div class=\"proto-step\">用户发送弹幕</div>\n    <div class=\"proto-arrow\">→</div>\n    <div class=\"proto-step\">WebSocket 网关</div>\n    <div class=\"proto-arrow\">→</div>\n    <div class=\"proto-step\">后端弹幕服务</div>\n    <div class=\"proto-arrow\">→</div>\n    <div class=\"proto-step\">广播给所有在线用户</div>\n  </div>\n\n  <h3>6.2 弹幕服务选型</h3>\n  <table>\n    <tr><th>方案</th><th>优点</th><th>缺点</th><th>推荐度</th></tr>\n    <tr><td><strong>自建 WebSocket（Node.js / Go）</strong></td><td>完全可控，成本低</td><td>需要自己处理高并发（1万并发=约10GB内存）</td><td><span class=\"bdg bdg-g\">推荐</span></td></tr>\n    <tr><td>腾讯云 IM（即时通讯）</td><td>接入简单，SDK完善</td><td>按消息条数收费，用户量大了成本高</td><td><span class=\"bdg bdg-y\">备选</span></td><\n<p style=\"color:#999;text-align:center;padding:20px\">[内容已截断，原文件见 /小动物科研培训平台/ ]</p>", "icon": "📹"}];
var currentRoute = "/";
function navigate(route) { currentRoute = route; renderView(); updateSidebar(); }
function renderView() { var main = document.getElementById("appContent"); var r = currentRoute;
  if (!r || r === "/") { renderHome(main);
  } else if (r.startsWith("report-")) { renderReport(main, parseInt(r.replace("report-","")));
  } else if (r === "prd-v4") { renderIframe(main, "/小动物科研培训平台/PRD/小动物科研培训网站_PRD_v4.0_可行性分析_1---986d224b-fee5-4699-abf0-0bdf2f65c33e.pdf", "📋 PRD v4.0 可行性分析", "完整技术架构/成本/风险/开发规划");
  } else if (r === "tree-v2") { renderIframe(main, "/小动物科研培训平台/功能图/功能模块树状图_v2.html", "🌳 功能模块树状图 v2", "11个一级模块，Phase 1-7 开发阶段");
  } else if (r === "demo") { renderIframe(main, "/小动物科研培训平台/demo/index.html", "🎨 Demo 原型", "Next.js+shadcn/ui 风格前端展示");
