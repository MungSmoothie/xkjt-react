var REPORTS = [{"num": 1, "title": "竞品分析", "html": "<div class=\"container\">\n  <div class=\"header\">\n    <h1>竞品分析报告</h1>\n    <div class=\"subtitle\">小动物科研培训平台 · 医学影像/兽医在线教育赛道研究 &nbsp;|&nbsp; 2026年3月</div>\n  </div>\n\n  <div class=\"section\">\n    <h2>一、研究背景与方法</h2>\n    <p>本报告聚焦于小动物（犬、猫、兔、鼠等实验动物）科研培训与医学影像（超声为主）在线教育赛道，系统梳理国内外主要竞争产品，从平台概况、课程规模与质量、定价策略、用户体量、特色功能五个维度展开分析，最终给出差异化定位建议。</p>\n    <p><strong>数据来源：</strong>公开资料整理（各平台官网、行业协会报告、国家统计数据），数据截至2026年初。部分用户规模数据为估算值。</p>\n  </div>\n\n  <div class=\"section\">\n    <h2>二、国内竞品分析</h2>\n\n    <h3>1. 宠医客（Chongyike）</h3>\n    <div class=\"highlight-box\">\n      <strong>网址：</strong>chongyike.com &nbsp;|&nbsp; <strong>定位：</strong>宠物医师继续教育培训<br>\n      <strong>业务模式：</strong>录播课 + 直播课 + 社群辅导，部分课程收费\n    </div>\n    <table>\n      <tr><th>维度</th><th>详情</th></tr>\n      <tr><td>课程数量</td><td>2000+ 节（涵盖内科、外科、影像、皮肤病等），以兽医临床为主</td></tr>\n      <tr><td>课程质量</td><td>讲师多为国内知名宠物医院主治医师，内容偏临床实用，系统性较强</td></tr>\n      <tr><td>定价</td><td>年会员约800-1200元/年；单课20-300元不等；高端课程（如外科实操）可达数千元</td></tr>\n      <tr><td>用户规模</td><td>注册用户超50万，活跃付费用户估算10-20万</td></tr>\n      <tr><td>特色功能</td><td>病例讨论社区、在线考试、结业证书、微信小程序</td></tr>\n      <tr><td>优势</td><td>课程体系完整，用户基数大，品牌知名度高，微信生态导流强</td></tr>\n      <tr><td>劣势</td><td>以宠物临床为主，科研培训内容少；小动物超声影像专项课程不足；价格偏高</td></tr>\n    </table>\n\n    <h3>2. 宠物医师网（cnsuv.com）</h3>\n    <div class=\"highlight-box\">\n      <strong>网址：</strong>cnsuv.com &nbsp;|&nbsp; <strong>定位：</strong>中国兽医网旗下继续教育平台<br>\n      <strong>业务模式：</strong>视频课程 + 文献资料，部分免费+付费结合\n    </div>\n    <table>\n      <tr><th>维度</th><th>详情</th></tr>\n      <tr><td>课程数量</td><td>约500节，医学影像类约50-80节</td></tr>\n      <tr><td>课程质量</td><td>以学术讲座、继教项目为主，内容偏理论，部分课程较老旧</td></tr>\n      <tr><td>定价</td><td>单课10-150元；会员年费约300-500元；部分免费</td></tr>\n      <tr><td>用户规模</td><td>注册用户约10-20万，以兽医从业者为主</td></tr>\n      <tr><td>特色功能</td><td>行业资讯、招聘栏目、文献下载、继续教育学分记录</td></tr>\n      <tr><td>优势</td><td>背靠中国兽医协会资源，学术权威性强，有学分认证体系</td></tr>\n      <tr><td>劣势</td><td>平台UI/UX较老旧，交互体验差；影像类课程深度不足；科研方向内容缺失</td></tr>\n    </table>\n\n    <h3>3. 宠医课堂（VetOnline）</h3>\n    <div class=\"highlight-box\">\n      <strong>定位：</strong>兽医影像学在线教育专项平台<br>\n      <strong>业务模式：</strong>录播 + 直播 + 1对1辅导，纯线上\n    </div>\n    <table>\n      <tr><th>维度</th><th>详情</th></tr>\n      <tr><td>课程数量</td><td>约150节，80%为超声/X光影像类</td></tr>\n      <tr><td>课程质量</td><td>专注影像细分领域，讲师有海外进修背景，内容偏中高端</td></tr>\n      <tr><td>定价</td><td>单课200-800元；系列课打包2000-5000元；年费会员约1500元</td></tr>\n      <tr><td>用户规模</td><td>活跃付费用户约5000-10000人</td></tr>\n      <tr><td>特色功能</td><td>影像病例库（案例教学）、超声扫查手法视频、专家答疑区</td></tr>\n      <tr><td>优势</td><td>影像垂直度极高，内容专业性强，差异化明显</td></tr>\n      <tr><td>劣势</td><td>用户规模小众，课程更新慢，价格偏高，非科研方向</td></tr>\n    </table>\n\n    <h3>4. 医学慕课（MediBoo）</h3>\n    <div class=\"highlight-box\">\n      <strong>定位：</strong>医学类综合在线教育，含兽医/动物医学分支<br>\n      <strong>业务模式：</strong>视频课程 + 直播，机构授权课程为主\n    </div>\n    <table>\n      <tr><th>维度</th><th>详情</th></tr>\n      <tr><td>课程数量</td><td>医学综合课程10000+，动物医学/兽医类约200-300节</td></tr>\n      <tr><td>课程质量</td><td>与医学院校合作，课程质量较高，有完善的教学大纲</td></tr>\n      <tr><td>定价</td><td>单课50-500元；机构账号按人数年费制，人均100-300元/年</td></tr>\n      <tr><td>用户规模</td><td>平台总用户数百万，兽医分支用户估算5-10万</td></tr>\n      <tr><td>特色功能</td><td>CME学分对接、医疗机构B2B渠道、APP多端学习</td></tr>\n      <tr><td>优势</td><td>品牌背书强，医学资源整合能力好，B端渠道成熟</td></tr>\n      <tr><td>劣势</td><td>兽医仅为边缘分支，科研实验动物方向内容极少，用户定位模糊</td></tr>\n    </table>\n\n    <h3>5. 实验动物从业人员培训平台（中国）</h3>\n    <div class=\"highlight-box\">\n      <strong>背景：</strong>实验动物行业受《实验动物管理条例》及GLP/GCP规范约束，从业人员需持证上岗<br>\n      <strong>代表平台：</strong>实验动物信息网（lasacn.com）、各省实验动物许可证管理平台\n    </div>\n    <table>\n      <tr><th>维度</th><th>详情</th></tr>\n      <tr><td>课程数量</td><td>各省不一，基础培训课程约20-50节</td></tr>\n      <tr><td>课程质量</td><td>以法规、操作规范为主，内容偏标准化，缺乏深度技术培训</td></tr>\n      <tr><td>定价</td><td>多为免费或行政性收费（100-500元/人次），机构统一组织</td></tr>\n      <tr><td>用户规模</td><td>全国实验动物从业机构数千家，人员估算30-50万人</td></tr>\n      <tr><td>特色功能</td><td>资格证考试报名、许可证年审对接、GLP合规培训</td></tr>\n      <tr><td>优势</td><td>政策强制属性，用户必须完成培训，有机构背书</td></tr>\n      <tr><td>劣势</td><td>内容枯燥、更新慢、商业化程度低、无互动学习体验</td></tr>\n    </table>\n  </div>\n\n  <div class=\"section\">\n    <h2>三、国外竞品分析</h2>\n\n    <h3>1. VetBloom（美国）</h3>\n    <div class=\"highlight-box\">\n      <strong>网址：</strong>vetbloom.com &nbsp;|&nbsp; <strong>定位：</strong>北美顶级兽医继续教育平台<br>\n      <strong>业务模式：</strong>RACE认证课程（美国兽医继续教育的官方认证体系），录播+直播+线下实操\n    </div>\n    <table>\n      <tr><th>维度</th><th>详情</th></tr>\n      <tr><td>课程数量</td><td>1000+节，覆盖所有兽医专科，影像类约150节</td></tr>\n      <tr><td>课程质量</td><td>讲师多为大学兽医学院教授和顶级动物医院专科医生，内容前沿</td></tr>\n      <tr><td>定价</td><td>月费约49美元/月；年费约399美元/年；单课50-300美元不等</td></tr>\n      <tr><td>用户规模</td><td>北美地区活跃用户估算10万+，RACE学分用户</td></tr>\n      <tr><td>特色功能</td><td>RACE学分证书（从业资格必需）、CE进度追踪、临床病例讨论</td></tr>\n      <tr><td>优势</td><td>北美最权威继续教育平台，学分认证体系完善，内容质量最高</td></tr>\n      <tr><td>劣势</td><td>英文界面，国内用户访问体验差；定价高；内容与国内临床场景脱节</td></tr>\n    </table>\n\n    <h3>2. EGS (European School of Veterinary Postgraduate Studies)</h3>\n    <div class=\"highlight-box\">\n      <strong>网址：</strong>esvps.org &nbsp;|&nbsp; <strong>定位：</strong>欧洲兽医研究生培训与认证<br>\n      <strong>业务模式：</strong>专科认证课程（Certificated课程），混合式学习（线上+线下）\n    </div>\n    <table>\n      <tr><th>维度</th><th>详情</th></tr>\n      <tr><td>课程数量</td><td>约30个专科方向，每个方向10-20节模块课，共约400节</td></tr>\n      <tr><td>课程质量</td><td>欧洲各国兽医学院联合授课，体系化程度高，有严格考核</td></tr>\n      <tr><td>定价</td><td>单个认证课程2000-5000欧元；全套高级专科课程可达10000+欧元</td></tr>\n      <tr><td>用户规模</td><td>欧洲范围内活跃学员约5000-10000人</td></tr>\n      <tr><td>特色功能</td><td>欧洲认证资质、专科证书、线上线下混合、导师制</td></tr>\n      <tr><td>优势</td><td>学术体系最完整，欧洲兽医界认可度高</td></tr>\n      <tr><td>劣势</td><td>价格极高，主要面向欧洲市场，国内用户几乎无法参与</td></tr>\n    </table>\n\n    <h3>3. SonoPath.com（美国）</h3>\n    <div class=\"highlight-box\">\n      <strong>网址：</strong>sonopath.com &nbsp;|&nbsp; <strong>定位：</strong>兽医超声影像专项培训，全球知名<br>\n      <strong>业务模式：</strong>录播课程 + 超声案例数据库 + 专家咨询\n    </div>\n    <table>\n      <tr><th>维度</th><th>详情</th></tr>\n      <tr><td>课程数量</td><td>约300节，几乎全部为超声影像相关</td></tr>\n      <tr><td>课程质量</td><td>由美国兽医影像学会资深专家授课，内容极其深入，B超心脏/腹部全覆盖</td></tr>\n      <tr><td>定价</td><td>月费约89美元；年费约699美元；单课150-500美元</td></tr>\n      <tr><td>用户规模</td><td>全球注册用户约2-3万，核心用户为影像科兽医</td></tr>\n      <tr><td>特色功能</td><td>超声影像数据库（可搜索病例）、扫查手法详解、临床应用导向</td></tr>\n      <tr><td>优势</td><td>超声影像领域全球最专业，内容无可挑剔</td></tr>\n      <tr><td>劣势</td><td>全英文；价格高；不涉及实验动物；与国内用户需求差距大</td></tr>\n    </table>\n\n    <h3>4. VET girl（美国）</h3>\n    <div class=\"highlight-box\">\n      <strong>网址：</strong>vetgirlontherun.com &nbsp;|&nbsp; <strong>定位：</strong>面向北美执业兽医的继续教育和临床资讯<br>\n      <strong>业务模式：</strong>播客（Podcast）+ 视频课程，订阅制\n    </div>\n    <table>\n      <tr><th>维度</th><th>详情</th></tr>\n      <tr><td>课程数量</td><td>视频课程约200节，以短时课程（15-60分钟）为主</td></tr>\n      <tr><td>课程质量</td><td>临床实用导向，讲师有丰富实战经验，更新频率高</td></tr>\n      <tr><td>定价</td><td>月费约29美元；年费约249美元；部分免费内容</td></tr>\n      <tr><td>用户规模</td><td>播客订阅用户超10万，活跃付费用户估算3-5万</td></tr>\n      <tr><td>特色功能</td><td>播客形式（可通勤收听）、CE学分追踪、临床tips系列</td></tr>\n      <tr><td>优势</td><td>内容轻松易懂，学习门槛低，用户粘性高</td></tr>\n      <tr><td>劣势</td><td>内容深度有限，无科研方向，无中文，无兽医学历教育</td></tr>\n    </table>\n\n    <h3>5. LabAnimal / ALN Magazine 在线培训平台</h3>\n    <div class=\"highlight-box\">\n      <strong>背景：</strong>实验动物科学（Laboratory Animal Science）领域有多个专业机构提供培训<br>\n      <strong>代表：</strong>AALAS（美国实验动物科学协会）在线学习平台 + LATA（英国实验动物协会）等\n    </div>\n    <table>\n      <tr><th>维度</th><th>详情</th></tr>\n      <tr><td>课程数量</td><td>AALAS在线课程约100节，含ALAT/LAT/LATG等级认证课程</td></tr>\n      <tr><td>课程质量</td><td>内容规范严谨，侧重操作规范和伦理，符合国际GLP标准</td></tr>\n      <tr><td>定价</td><td>AALAS会员价课程50-300美元/节；非会员加价30-50%</td></tr>\n      <tr><td>用户规模</td><td>AALAS会员约15000人，活跃学习用户约数千人</td></tr>\n      <tr><td>特色功能</td><td>国际认证资质、ALAT/LAT/LATG等级考试、职业发展路径</td></tr>\n      <tr><td>优势</td><td>国际实验动物行业通行认证，有公信力，内容体系完善</td></tr>\n      <tr><td>劣势</td><td>纯英文，无中文；内容偏向西方实验动物管理体系；价格较高</td></tr>\n    </table>\n  </div>\n\n  <div class=\"section\">\n    <h2>四、竞品综合对比</h2>\n    <table>\n      <tr>\n        <th>平台</th>\n        <th>细分定位</th>\n        <th>课程数量</th>\n        <th>价格区间</th>\n        <th>用户规模</th>\n        <th>核心优势</th>\n        <th>核心劣势</th>\n      </tr>\n      <tr>\n        <td>宠医客</td>\n        <td>宠物临床综合</td>\n        <td>2000+</td>\n        <td>800-1200元/年</td>\n        <td>10-20万</td>\n        <td>用户基数大，微信生态</td>\n        <td>科研内容少，超声专项弱</td>\n      </tr>\n      <tr>\n        <td>宠物医师网</td>\n        <td>学术继续教育</td>\n        <td>500</td>\n        <td>300-500元/年</td>\n        <td>10-20万</td>\n        <td>协会背书，学分认证</td>\n        <td>平台老旧，深度不足</td>\n      </tr>\n      <tr>\n        <td>宠医课堂</td>\n        <td>兽医影像专项</td>\n        <td>150</td>\n        <td>200-5000元</td>\n        <td>0.5-1万</td>\n        <td>影像垂直深度高</td>\n        <td>用户小众，价格偏高</td>\n      </tr>\n      <tr>\n        <td>医学慕课</td>\n        <td>医学综合（含兽医）</td>\n        <td>10000+（兽医200+）</td>\n        <td>50-500元/课</td>\n        <td>5-10万（兽医分支）</td>\n        <td>B端渠道强，学分对接</td>\n        <td>兽医边缘化，科研缺失</td>\n      </tr>\n      <tr>\n        <td>实验动物培训（国内）</td>\n        <td>实验动物法规培训</td>\n        <td>20-50</td>\n        <td>0-500元</td>\n        <td>30-50万（从业者）</td>\n        <td>政策强制属性</td>\n        <td>内容枯燥，商业化低</td>\n      </tr>\n      <tr>\n        <td>VetBloom（美国）</td>\n        <td>北美综合继续教育</td>\n        <td>1000+</td>\n        <td>399-799美元/年</td>\n        <td>10万+</td>\n        <td>RACE学分，最权威</td>\n        <td>英文，国内用户难触达</td>\n      </tr>\n      <tr>\n        <td>SonoPath（美国）</td>\n        <td>兽医超声专项</td>\n        <td>300</td>\n        <td>89美元/月</td>\n        <td>2-3万</td>\n        <td>超声领域全球最专业</td>\n        <td>无中文，无科研，无设备绑定</td>\n      </tr>\n      <tr>\n        <td>AALAS（美国）</td>\n        <td>实验动物科学</td>\n        <td>100</td>\n        <td>50-300美元/节</td>\n        <td>数千</td>\n        <td>国际认证资质</td>\n        <td>英文，体系西方化</td>\n      </tr>\n    </table>\n  </div>\n\n  <div class=\"section\">\n    <h2>五、市场空白与机会识别</h2>\n    <p>通过以上分析，我们识别出以下市场空白：</p>\n    <div class=\"highlight-box\">\n      <ol>\n        <li><strong>实验动物科研培训严重供给不足：</strong>国内现有平台要么偏向宠物临床（宠医客），要么偏向法规合规（各省实验动物平台），几乎没有面向<strong>小动物科研实验设计、模型构建、数据采集（影像方向）</strong>的系统性在线教育产品。</li>\n        <li><strong>兽医影像+科研的交叉地带无人占领：</strong>SonoPath做影像但不做科研；国内宠医课堂做影像但偏向临床。科研场景下的超声应用（动物模型建立、药物疗效评估、影像组学数据采集等）几乎没有系统课程。</li>\n<p style=\"color:#999;text-align:center;padding:20px\">[内容已截断，原文件见 /小动物科研培训平台/ ]</p></div>", "icon": "📊"}, {"num": 2, "title": "用户画像", "html": "<div class=\"container\">\n  <div class=\"header\">\n    <h1>目标用户画像报告</h1>\n    <div class=\"subtitle\">小动物科研培训平台 · 用户群体深度分析 &nbsp;|&nbsp; 2026年3月</div>\n  </div>\n\n  <div class=\"section\">\n    <h2>一、目标用户群体总览</h2>\n    <p>本平台的目标用户群体可细分为以下六大类别，涵盖科研端、设备端与学习端的不同角色，形成完整的用户生态。</p>\n\n    <div class=\"stat-row\">\n      <div class=\"stat-box\">\n        <div class=\"num\">100万+</div>\n        <div class=\"label\">潜在用户总量估算</div>\n      </div>\n      <div class=\"stat-box\">\n        <div class=\"num\">17万+</div>\n        <div class=\"label\">执业兽医数量</div>\n      </div>\n      <div class=\"stat-box\">\n        <div class=\"num\">30-50万</div>\n        <div class=\"label\">实验动物从业人员</div>\n      </div>\n    </div>\n    <div class=\"stat-row\">\n      <div class=\"stat-box\">\n        <div class=\"num\">3000+</div>\n        <div class=\"label\">实验动物机构</div>\n      </div>\n      <div class=\"stat-box\">\n        <div class=\"num\">500+</div>\n        <div class=\"label\">GLP实验室数量</div>\n      </div>\n      <div class=\"stat-box\">\n        <div class=\"num\">200+</div>\n        <div class=\"label\">有影像设备的科研机构</div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h2>二、六类核心用户群体详解</h2>\n\n    <h3>群体A：实验动物科研人员（PI/研究员）</h3>\n    <div class=\"persona-card\">\n      <h3>🔬 用户特征画像</h3>\n      <table>\n        <tr><th>属性</th><th>描述</th></tr>\n        <tr><td>典型身份</td><td>大学实验室PI、研究所研究员、药企临床前研究部门负责人</td></tr>\n        <tr><td>学历背景</td><td>博士为主（80%+），兽医学、医学、生物学背景</td></tr>\n        <tr><td>年龄区间</td><td>30-55岁，以35-45岁为中坚</td></tr>\n        <tr><td>单位类型</td><td>高校动物实验中心、医科院所、药企CRO部门、生物制药公司</td></tr>\n        <tr><td>年均可支配培训预算</td><td>机构：5-20万元；个人：0.5-2万元</td></tr>\n        <tr><td>年均可支配培训预算</td><td>高度注重实用性和可操作性，科研结果导向</td></tr>\n        <tr><td>学习偏好</td><td>系统化课程、案例驱动、愿意为高质量内容付费</td></tr>\n        <tr><td>时间特征</td><td>碎片化时间多（实验间隙），偏好可随时暂停的录播课程</td></tr>\n        <tr><td>决策权</td><td>强（可自己决策，也可推动机构采购）</td></tr>\n      </table>\n      <div class=\"highlight-box\">\n        <strong>核心痛点：</strong>① 国内缺乏小动物超声影像在科研中应用的系统性课程；② 超声扫查手法不规范导致数据偏差；③ 设备操作培训依赖厂家现场支持，效率低；④ 缺乏将影像数据转化为科研产出（论文/专利）的方法论指导。\n      </div>\n    </div>\n\n    <h3>群体B：兽医专业研究生/博士生</h3>\n    <div class=\"persona-card\">\n      <h3>📚 用户特征画像</h3>\n      <table>\n        <tr><th>属性</th><th>描述</th></tr>\n        <tr><td>典型身份</td><td>兽医学、基础医学、药理学方向在读硕士/博士研究生</td></tr>\n        <tr><td>学历背景</td><td>硕士（60%）、博士（35%）、少量在站博士后</td></tr>\n        <tr><td>年龄区间</td><td>23-32岁</td></tr>\n        <tr><td>单位类型</td><td>农业大学兽医学院、医学院实验动物中心、综合大学生命科学学院</td></tr>\n        <tr><td>月均可支配收入</td><td>1500-5000元（包含补贴/工资）</td></tr>\n        <tr><td>培训付费意愿</td><td>中等偏低，价格敏感，但为必要的技能培训愿意投入</td></tr>\n        <tr><td>学习偏好</td><td>基础入门+进阶提升；偏好有作业+反馈的课程；关注能否写进简历/简历加分</td></tr>\n        <tr><td>时间特征</td><td>有相对完整的学习时间，但实验任务繁重，偏好短时高频学习</td></tr>\n        <tr><td>社交属性</td><td>强（会在同门/课题组内传播推荐）</td></tr>\n      </table>\n      <div class=\"highlight-box\">\n        <strong>核心痛点：</strong>① 实验动物操作技术缺乏系统性培训，导师只能带\"师兄带师弟\"；② 超声/影像技术是发文热门，但校内缺乏系统教学；③ 就业竞争激烈，希望积累差异化技能；④ 费用敏感，盗版资源获取意愿强。\n      </div>\n    </div>\n\n    <h3>群体C：实验动物技术员/饲养员</h3>\n    <div class=\"persona-card\">\n      <h3>🛠️ 用户特征画像</h3>\n      <table>\n        <tr><th>属性</th><th>描述</th></tr>\n        <tr><td>典型身份</td><td>实验动物从业资格证持证人员、动物房技术员、笼具管理员</td></tr>\n        <tr><td>学历背景</td><td>大专/本科为主（80%），部分中专+职业培训</td></tr>\n        <tr><td>年龄区间</td><td>22-45岁</td></tr>\n        <tr><td>单位类型</td><td>实验动物中心、GLP实验室、药企安评中心、医院实验动物房</td></tr>\n        <tr><td>月收入</td><td>5000-10000元（二线城市为主）</td></tr>\n        <tr><td>培训付费意愿</td><td>低（主要由单位组织培训，个人付费意愿弱）</td></tr>\n        <tr><td>学习偏好</td><td>操作规范、技能证书、职业晋升通道</td></tr>\n        <tr><td>时间特征</td><td>工作时间碎片化，偏好短视频+图文</td></tr>\n        <tr><td>特殊要求</td><td>部分岗位需持证上岗（实验动物从业资格证）</td></tr>\n      </table>\n      <div class=\"highlight-box\">\n        <strong>核心痛点：</strong>① 现有培训多为政府/机构组织的法规类课程，内容枯燥；② 缺乏新技术（智能笼、超声设备）的操作培训；③ 职业晋升通道不清晰；④ 自学能力弱，需要引导式学习。\n      </div>\n    </div>\n\n    <h3>群体D：医疗器械（超声/智能笼）设备工程师</h3>\n    <div class=\"persona-card\">\n      <h3>⚙️ 用户特征画像</h3>\n      <table>\n        <tr><th>属性</th><th>描述</th></tr>\n        <tr><td>典型身份</td><td>设备厂商售前工程师、售后维修工程师、应用培训专员（FAE）</td></tr>\n        <tr><td>学历背景</td><td>生物医学工程、医疗器械、电子信息工程背景本科为主</td></tr>\n        <tr><td>年龄区间</td><td>25-40岁</td></tr>\n        <tr><td>单位类型</td><td>超声设备厂商、智能笼/生命科学设备厂商、经销商</td></tr>\n        <tr><td>年收入</td><td>10-25万元</td></tr>\n        <tr><td>培训付费意愿</td><td>中等（公司报销为主，个人决策权重低）</td></tr>\n        <tr><td>学习偏好</td><td>设备操作手册视频、故障排查案例、竞品对比分析</td></tr>\n        <tr><td>时间特征</td><td>出差途中学习需求大，偏好移动端+可下载视频</td></tr>\n        <tr><td>关键需求</td><td>需要掌握设备在科研场景中的应用，而不仅是临床操作</td></tr>\n      </table>\n      <div class=\"highlight-box\">\n        <strong>核心痛点：</strong>① 原厂培训周期长、内容更新慢；② 缺乏设备在科研场景（动物模型）中的系统培训资料；③ 竞品资料难以获取；④ 设备更新迭代快，需要持续学习。\n      </div>\n    </div>\n\n    <h3>群体E：药企/CRO临床前研究人员</h3>\n    <div class=\"persona-card\">\n      <h3>💊 用户特征画像</h3>\n      <table>\n        <tr><th>属性</th><th>描述</th></tr>\n        <tr><td>典型身份</td><td>药效学研究员、毒理学研究员、临床前项目经理</td></tr>\n        <tr><td>学历背景</td><td>硕士/博士，药学、药理学、兽医学、生物学背景</td></tr>\n        <tr><td>年龄区间</td><td>28-45岁</td></tr>\n        <tr><td>单位类型</td><td>创新药企业、CRO公司（药明康德、昭衍等）、疫苗企业</td></tr>\n        <tr><td>年均可支配培训预算</td><td>个人1-3万；机构10-50万</td></tr>\n        <tr><td>培训付费意愿</td><td>高（公司报销渠道顺畅）</td></tr>\n        <tr><td>学习偏好</td><td>高度实用导向，关注GLP合规、FDA/NMPA申报要求</td></tr>\n        <tr><td>决策权</td><td>可推动机构采购，对培训内容有评价权</td></tr>\n      </table>\n      <div class=\"highlight-box\">\n        <strong>核心痛点：</strong>① 药效/毒理实验需要规范的超声检测流程，但国内缺乏符合GLP要求的培训；② 影像数据在IND申报中的标准化要求严格；③ CRO行业人员流动大，新人培训成本高；④ 需要符合NMPA/FDA规范的特定课程。\n      </div>\n    </div>\n\n    <h3>群体F：宠物医院科研型兽医师</h3>\n    <div class=\"persona-card\">\n      <h3>🏥 用户特征画像</h3>\n      <table>\n        <tr><th>属性</th><th>描述</th></tr>\n        <tr><td>典型身份</td><td>宠物连锁医院技术院长、专科医生、有科研需求的临床兽医</td></tr>\n        <tr><td>学历背景</td><td>本科（执业兽医）+ 硕士（部分）</td></tr>\n        <tr><td>年龄区间</td><td>28-45岁</td></tr>\n        <tr><td>单位类型</td><td>连锁宠物医院（瑞鹏、瑞派等）、大型宠物专科医院</td></tr>\n        <tr><td>年收入</td><td>15-40万元</td></tr>\n        <tr><td>培训付费意愿</td><td>高（医院有培训预算，个人也有自付意愿）</td></tr>\n        <tr><td>学习偏好</td><td>与竞品形成差异化的特色技术、影像高级应用、论文发表指导</td></tr>\n      </table>\n      <div class=\"highlight-box\">\n        <strong>核心痛点：</strong>① 宠物临床超声培训已有人做，但科研转化能力不足；② 希望建立个人学术品牌，但缺乏科研训练；③ 医院采购设备后缺乏系统培训支持。\n      </div>\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h2>三、用户数量规模估算</h2>\n    <table>\n      <tr>\n        <th>用户群体</th>\n        <th>估算规模</th>\n        <th>数据来源/依据</th>\n        <th>付费用户转化率估算</th>\n        <th>潜在付费用户规模</th>\n      </tr>\n      <tr>\n        <td>全国执业兽医</td>\n        <td>约17万人</td>\n        <td>农业农村部2023年数据</td>\n        <td>5-10%</td>\n        <td>0.85-1.7万人</td>\n      </tr>\n      <tr>\n        <td>实验动物从业人员</td>\n        <td>30-50万人</td>\n        <td>科技部实验动物资源调查估算</td>\n        <td>3-8%</td>\n        <td>0.9-4万人</td>\n      </tr>\n      <tr>\n        <td>实验动物科研PI/研究员</td>\n        <td>3-5万人</td>\n        <td>国家自然科学基金依托单位估算</td>\n        <td>15-25%</td>\n        <td>0.45-1.25万人</td>\n      </tr>\n      <tr>\n        <td>兽医学/医学研究生</td>\n        <td>10-15万人</td>\n        <td>教育部统计数据（含在读硕博）</td>\n        <td>8-15%</td>\n        <td>0.8-2.25万人</td>\n      </tr>\n      <tr>\n        <td>医疗器械设备工程师</td>\n        <td>5-10万人（兽医/生命科学设备方向）</td>\n        <td>行业协会估算</td>\n        <td>10-20%</td>\n        <td>0.5-2万人</td>\n      </tr>\n      <tr>\n        <td>药企/CRO研究人员</td>\n        <td>10-20万人（涉及动物实验相关）</td>\n        <td>CRO行业报告估算</td>\n        <td>5-10%</td>\n        <td>0.5-2万人</td>\n      </tr>\n      <tr>\n        <td colspan=\"3\"><strong>合计潜在付费用户</strong></td>\n        <td colspan=\"2\"><strong>约4-15万人</strong></td>\n      </tr>\n    </table>\n    <div class=\"highlight-box\">\n      <strong>核心目标用户规模估算：</strong>结合平台定位（小动物科研+超声影像+设备码模式），俺们最核心的用户是：科研PI/研究员（1-1.5万）、兽医学研究生（1-2万）、设备工程师（0.5-1万），三者合计约<strong>2.5-4.5万高意向付费用户</strong>，加上外围用户（法规培训、基础课程等），市场天花板约10-15万人。\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h2>四、用户地区分布分析</h2>\n    <table>\n      <tr>\n        <th>地区</th>\n        <th>用户密度</th>\n        <th>主要分布机构</th>\n        <th>特征描述</th>\n      </tr>\n      <tr>\n        <td>北京</td>\n        <td>★★★★★</td>\n        <td>中国医学科学院、军事医学科学院、北京大学、清华大学、中国农业大学</td>\n        <td>顶级科研机构密集，实验动物资源最丰富，超声设备需求最大</td>\n      </tr>\n      <tr>\n        <td>上海</td>\n        <td>★★★★★</td>\n        <td>中科院上海分院、复旦大学、上海交通大学、药明康德、昭衍</td>\n        <td>CRO公司聚集，药企研发投入大，GLP实验室数量全国最多</td>\n      </tr>\n      <tr>\n        <td>江苏（南京/苏州）</td>\n        <td>★★★★</td>\n        <td>南京大学、东南大学、南京医科大学、苏州生物医药企业群</td>\n        <td>生物医药产业发达，创新药企业密集</td>\n      </tr>\n      <tr>\n        <td>广东（广州/深圳）</td>\n        <td>★★★★</td>\n        <td>华南理工大学、中山大学、深圳先进技术研究院、华大基因</td>\n        <td>生命科学新兴力量，宠物医疗产业发达</td>\n      </tr>\n      <tr>\n        <td>浙江（杭州）</td>\n        <td>★★★</td>\n        <td>浙江大学、西湖大学、浙江省医学科学院、阿里健康</td>\n        <td>数字医疗与生命科学结合紧密</td>\n      </tr>\n      <tr>\n        <td>湖北（武汉）</td>\n        <td>★★★</td>\n        <td>武汉大学、华中科技大学、中科院武汉分院</td>\n        <td>传统兽医学重镇，实验动物学科积累深厚</td>\n      </tr>\n      <tr>\n        <td>四川（成都）</td>\n        <td>★★★</td>\n        <td>四川大学、成都生物制品研究所</td>\n        <td>西部生物医药重要基地</td>\n      </tr>\n      <tr>\n        <td>陕西（西安）</td>\n        <td>★★</td>\n        <td>第四军医大学、西北农林科技大学</td>\n        <td>兽医学教育传统强校集中</td>\n      </tr>\n      <tr>\n        <td>东北（长春/沈阳）</td>\n        <td>★★</td>\n        <td>吉林大学、东北师范大学、沈阳药科大学</td>\n        <td>传统药学重镇，实验动物资源较丰富</td>\n      </tr>\n    </table>\n    <div class=\"highlight-box\">\n      <strong>地域分布结论：</strong>用户呈现明显的\"头部集中\"特征——北京和上海合计可能占据40-50%的用户，其次是江苏、广东、浙江。用户地域分布与生物医药产业聚集度高度相关，一线城市和强二线城市（苏州、杭州、深圳、武汉、成都）是重点目标市场。\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h2>五、用户付费能力与意愿分析</h2>\n    <table>\n      <tr>\n        <th>用户群体</th>\n        <th>年均可接受支出</th>\n        <th>付费动机</th>\n        <th>价格敏感度</th>\n        <th>最佳定价策略</th>\n      </tr>\n      <tr>\n        <td>科研PI/研究员</td>\n        <td>1-5万元（机构+个人）</td>\n        <td>科研产出效率提升、团队培训合规</td>\n        <td>低</td>\n        <td>机构年费账号 + 高端专项课程</td>\n      </tr>\n      <tr>\n        <td>兽医学研究生</td>\n        <td>500-3000元</td>\n        <td>技能提升、就业竞争力</td>\n        <td>高</td>\n        <td>低价年费会员 + 单课精选</td>\n      </tr>\n      <tr>\n        <td>实验动物技术员</td>\n        <td>0-1000元</td>\n        <td>证书需求、职业晋升</td>\n        \n<p style=\"color:#999;text-align:center;padding:20px\">[内容已截断，原文件见 /小动物科研培训平台/ ]</p></div>", "icon": "👤"}, {"num": 3, "title": "课程内容", "html": "<div class=\"container\">\n  <div class=\"header\">\n    <h1>课程内容来源报告</h1>\n    <div class=\"subtitle\">小动物科研培训平台 · 课程制作与采购策略 &nbsp;|&nbsp; 2026年3月</div>\n  </div>\n\n  <div class=\"section\">\n    <h2>一、医学/兽医类在线教育课程内容制作方式概述</h2>\n    <p>医学与兽医类在线教育课程的内容制作方式，与大众知识类内容有本质区别——它要求极高的专业性、准确性和合规性。行业内主流的制作方式可分为三大类：</p>\n    <div class=\"highlight-box\">\n      <ol>\n        <li><strong>自制内容（In-house Production）：</strong>平台自己组建团队，完成从选题策划、讲师邀约到拍摄制作的全流程。优点是内容可控、差异化强；缺点是前期投入大、周期长。</li>\n        <li><strong>联合制作（Co-production）：</strong>与医学院校、学术机构、行业协会联合开发课程，共担成本、共享版权。优点是借助机构公信力和专家资源；缺点是版权协调复杂，商业化决策慢。</li>\n        <li><strong>外部采购（Third-party Acquisition）：</strong>直接采购已有课程内容（录播课版权购买/授权）。优点是快速扩充内容库；缺点是内容同质化、难以形成差异化。</li>\n      </ol>\n    </div>\n    <p>俺们的建议是：核心课程采用<strong>自制+联合制作</strong>模式（建立壁垒），基础/补充课程可适当<strong>外部采购</strong>（快速扩充SKU）。</p>\n  </div>\n\n  <div class=\"section\">\n    <h2>二、自制课程全流程拆解</h2>\n\n    <h3>2.1 自制课程的标准流程（6步法）</h3>\n    <div class=\"flow-box\">\n      <strong>第一步：需求调研与选题策划（2-3周）</strong>\n      <ol>\n        <li>用户痛点调研：通过问卷/访谈了解目标用户最急需的课程主题</li>\n        <li>竞品缺口分析：梳理现有平台缺失的主题，避免同质化</li>\n        <li>选题决策：优先选择\"高需求+低供给+俺们能讲好\"的交叉领域</li>\n        <li>输出：《课程选题表》+《课程大纲》（知识点拆解到最小单元）</li>\n      </ol>\n    </div>\n    <div class=\"flow-box\">\n      <strong>第二步：讲师邀约与确认（2-4周）</strong>\n      <ol>\n        <li>候选人画像：优选有\"临床/科研经验+教学表达能力+行业影响力\"三合一背景的专家</li>\n        <li>邀约渠道：学术会议接触、行业协会推荐、已有合作关系延伸、同行推荐</li>\n        <li>合作模式谈判：课酬形式（固定报酬/版税分成/免费置换）、版权归属、肖像权授权</li>\n        <li>输出：《讲师合作协议》+《课程内容大纲确认函》</li>\n      </ol>\n    </div>\n    <div class=\"flow-box\">\n      <strong>第三步：课程设计与备课（1-2周）</strong>\n      <ol>\n        <li>课件制作：PPT/讲义编写，要求图文并茂，适合屏幕阅读</li>\n        <li>脚本撰写：完整口语化脚本（避免现场发挥导致内容质量不稳定）</li>\n        <li>实操演示准备：超声扫查需要模特动物/模拟器、器械准备、场地布置</li>\n        <li>QA准备：预设学员常见问题，准备答疑内容</li>\n        <li>输出：《完整课件》+《课程脚本》+《拍摄脚本》</li>\n      </ol>\n    </div>\n    <div class=\"flow-box\">\n      <strong>第四步：专业拍摄与制作（1-2周/节课程）</strong>\n      <ol>\n        <li>拍摄方式选择：\n          <ul>\n            <li><strong>演播室录制：</strong>绿幕抠像+后期字幕，适合理论讲解类课程</li>\n            <li><strong>实景拍摄：</strong>在动物实验室/手术室实拍，适合实操演示类课程</li>\n            <li><strong>屏幕录制：</strong>录屏软件录制软件操作、数据分析过程</li>\n            <li><strong>混合模式：</strong>理论部分演播室+实操部分实景，后期剪辑拼接</li>\n          </ul>\n        </li>\n        <li>设备要求：4K摄像机、专业领夹麦克风、补光灯、超声设备（配套录制）、提词器</li>\n        <li>后期制作：剪辑、调色、字幕制作、配音（可选）、片头片尾制作</li>\n        <li>输出：粗剪版 → 讲师审核 → 修改 → 成片</li>\n      </ol>\n    </div>\n    <div class=\"flow-box\">\n      <strong>第五步：质量审核与合规检查（3-5天）</strong>\n      <ol>\n        <li>内容准确性审核：医学内容必须经专家复核，确保无错误</li>\n        <li>版权合规检查：所有图片/视频素材是否有合法授权</li>\n        <li>合规性审查：涉及医疗器械描述是否合规（广告法、医疗器械监管法规）</li>\n        <li>技术质量检查：画质、音质、字幕准确性</li>\n        <li>输出：《课程质量审核报告》+《合规审核通过函》</li>\n      </ol>\n    </div>\n    <div class=\"flow-box\">\n      <strong>第六步：上线运营与迭代（持续）</strong>\n      <ol>\n        <li>课程上架：标题、简介、标签、章节结构、配套资料上传</li>\n        <li>学习数据监控：完播率、章节跳出点、学员评价</li>\n        <li>迭代优化：根据数据反馈更新内容（镜头补拍、章节调整）</li>\n        <li>输出：定期《课程健康度报告》</li>\n      </ol>\n    </div>\n\n    <h3>2.2 自制课程成本拆解</h3>\n    <table>\n      <tr>\n        <th>成本项目</th>\n        <th>单项估算</th>\n        <th>备注</th>\n      </tr>\n      <tr>\n        <td>讲师课酬（专家级）</td>\n        <td>3000-10000元/节（45分钟课程）</td>\n        <td>知名专家/教授更高；普通讲者2000-5000元</td>\n      </tr>\n      <tr>\n        <td>拍摄团队费用</td>\n        <td>2000-5000元/节</td>\n        <td>含摄影师、灯光师；实景拍摄费用更高</td>\n      </tr>\n      <tr>\n        <td>后期制作</td>\n        <td>1500-3000元/节</td>\n        <td>剪辑+字幕+调色</td>\n      </tr>\n      <tr>\n        <td>场地/设备租赁</td>\n        <td>500-2000元/节</td>\n        <td>若使用自有演播室则无此成本</td>\n      </tr>\n      <tr>\n        <td>课件制作（设计）</td>\n        <td>500-1500元/节</td>\n        <td>专业医学PPT设计</td>\n      </tr>\n      <tr>\n        <td>质量审核</td>\n        <td>500-1000元/节</td>\n        <td>专家复核费用</td>\n      </tr>\n      <tr>\n        <td>平台运营（分摊）</td>\n        <td>500-1000元/节</td>\n        <td>上架、运营、客服成本分摊</td>\n      </tr>\n      <tr>\n        <td><strong>合计估算</strong></td>\n        <td><strong>8000-23000元/节</strong></td>\n        <td>单节45分钟课程，综合成本</td>\n      </tr>\n    </table>\n    <div class=\"highlight-box\">\n      <strong>自制课程成本结论：</strong>一节45分钟高质量课程，自制综合成本约<strong>1-2.5万元</strong>。一个系列课（10节）自制成本约<strong>10-25万元</strong>。如果年产能30-50节课程，年内容投入约<strong>300-1000万元</strong>。这是重投入，但也是建立竞争壁垒的核心。\n    </div>\n\n    <h3>2.3 自制课程周期拆解</h3>\n    <table>\n      <tr>\n        <th>课程类型</th>\n        <th>开发周期</th>\n        <th>节数</th>\n        <th>每节时长</th>\n        <th>适用场景</th>\n      </tr>\n      <tr>\n        <td>理论讲解类（演播室）</td>\n        <td>2-3周/节</td>\n        <td>按需</td>\n        <td>20-45分钟</td>\n        <td>概念、原理、规范讲解</td>\n      </tr>\n      <tr>\n        <td>实操演示类（实景拍摄）</td>\n        <td>3-4周/节</td>\n        <td>按需</td>\n        <td>30-60分钟</td>\n        <td>超声扫查、手术操作、设备使用</td>\n      </tr>\n      <tr>\n        <td>案例分析类（病例讨论）</td>\n        <td>2周/节</td>\n        <td>按需</td>\n        <td>30-45分钟</td>\n        <td>科研案例、临床病例分析</td>\n      </tr>\n      <tr>\n        <td>系列课程包（10节）</td>\n        <td>3-5个月</td>\n        <td>10节</td>\n        <td>每节30-45分钟</td>\n        <td>系统性学习路径</td>\n      </tr>\n    </table>\n  </div>\n\n  <div class=\"section\">\n    <h2>三、外部课程采购价格区间</h2>\n\n    <h3>3.1 采购模式一：课程版权买断</h3>\n    <table>\n      <tr>\n        <th>课程类型</th>\n        <th>买断价格区间</th>\n        <th>评估依据</th>\n        <th>注意事项</th>\n      </tr>\n      <tr>\n        <td>普通讲者录播课（兽医临床类）</td>\n        <td>2000-8000元/节</td>\n        <td>讲师知名度、内容深度、制作质量</td>\n        <td>买断后永久可用，需明确是否独家</td>\n      </tr>\n      <tr>\n        <td>专家/教授级课程</td>\n        <td>1-5万元/节</td>\n        <td>行业影响力、独家性</td>\n        <td>通常有版税分成，需谈判</td>\n      </tr>\n      <tr>\n        <td>系列课程包（10节）</td>\n        <td>3-15万元</td>\n        <td>系统性、完整性</td>\n        <td>打包采购通常有折扣</td>\n      </tr>\n      <tr>\n        <td>进口海外课程（翻译+本地化）</td>\n        <td>原版价格2-5倍</td>\n        <td>翻译费（500-1500元/节）+授权费</td>\n        <td>需确认中文授权合法性</td>\n      </tr>\n    </table>\n\n    <h3>3.2 采购模式二：课程授权/版税分成</h3>\n    <table>\n      <tr>\n        <th>模式</th>\n        <th>分成比例</th>\n        <th>适用情况</th>\n      </tr>\n      <tr>\n        <td>保底+版税</td>\n        <td>平台预付5000-20000元保底，后期销售分成15-30%</td>\n        <td>知名讲师，预期销量大</td>\n      </tr>\n      <tr>\n        <td>纯版税分成</td>\n        <td>销售额30-50%归讲师</td>\n        <td>新合作，讲师风险共担</td>\n      </tr>\n      <tr>\n        <td>年费授权</td>\n        <td>年费5000-50000元，在授权期内无限播放</td>\n        <td>机构/院校课程</td>\n      </tr>\n    </table>\n\n    <h3>3.3 采购渠道</h3>\n    <div class=\"highlight-box\">\n      <ol>\n        <li><strong>直接联系讲师：</strong>学术会议、行业协会、年会等场合直接接触，效率最高</li>\n        <li><strong>医学院校合作：</strong>中国农业大学、南京农业大学、华南农业大学等有大量兽医学课程资源</li>\n        <li><strong>行业协会：</strong>中国兽医协会、实验动物学会、各省畜牧兽医学会</li>\n        <li><strong>同业平台合作：</strong>与宠医客等平台谈内容授权合作（资源互换）</li>\n        <li><strong>CRO公司：</strong>药明康德、昭衍等有大量内部培训视频，可谈授权</li>\n        <li><strong>设备厂商：</strong>部分厂商有原厂培训视频，可谈OEM/授权</li>\n      </ol>\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h2>四、课程讲师的获取渠道与策略</h2>\n\n    <h3>4.1 理想讲师画像</h3>\n    <table>\n      <tr>\n        <th>维度</th>\n        <th>优先级要求</th>\n        <th>说明</th>\n      </tr>\n      <tr>\n        <td>专业背景</td>\n        <td>⭐⭐⭐⭐⭐ 必要</td>\n        <td>兽医学/医学博士+实验室PI经历优先</td>\n      </tr>\n      <tr>\n        <td>实战经验</td>\n        <td>⭐⭐⭐⭐⭐ 必要</td>\n        <td>有小动物超声/实验动物操作一线经验</td>\n      </tr>\n      <tr>\n        <td>教学能力</td>\n        <td>⭐⭐⭐⭐ 重要</td>\n        <td>能清晰表达，有课件制作经验更佳</td>\n      </tr>\n      <tr>\n        <td>行业影响力</td>\n        <td>⭐⭐⭐ 有加分</td>\n        <td>有论文发表、协会任职、教材编写经验</td>\n      </tr>\n      <tr>\n        <td>表达能力</td>\n        <td>⭐⭐⭐⭐ 重要</td>\n        <td>镜头感好，口齿清晰，有普通话要求</td>\n      </tr>\n    </table>\n\n    <h3>4.2 讲师获取的六大渠道</h3>\n    <div class=\"highlight-box\">\n      <strong>渠道一：学术会议现场接触（优先级：⭐⭐⭐⭐⭐）</strong><br>\n      中国实验动物学会年会、中国兽医影像年会、各省畜牧兽医学会学术会议、美国兽医影像学会（ACVR）年会等。现场演示平台价值，邀请入驻，转化率最高。<br><br>\n      <strong>渠道二：医学院校合作（优先级：⭐⭐⭐⭐）</strong><br>\n      中国农业大学兽医学院、南京农业大学、上海兽医研究所等。教授/副教授有科研+教学双重背景，是最佳讲师来源。<br><br>\n      <strong>渠道三：行业协会推荐（优先级：⭐⭐⭐⭐）</strong><br>\n      中国兽医协会、中国实验动物学会。可通过协会背书邀请讲师，协会也乐于有商业平台承担培训职能。<br><br>\n      <strong>渠道四：同行/学员推荐（优先级：⭐⭐⭐）</strong><br>\n      已入驻讲师推荐同行，学员推荐自己尊敬的导师。口碑传播是高质量讲师的重要来源。<br><br>\n      <strong>渠道五：设备厂商FAE团队（优先级：⭐⭐⭐⭐）</strong><br>\n      设备厂商的应用工程师（FAE）有丰富的设备操作培训经验，是设备相关课程的理想讲师来源，且厂商通常愿意支持（扩大品牌影响力）。<br><br>\n      <strong>渠道六：海外讲师引进（优先级：⭐⭐）</strong><br>\n      通过AALAS、ESVPS等国际机构引入国际课程，或购买SonoPath等平台内容授权，作为高端内容补充。\n    </div>\n\n    <h3>4.3 讲师激励机制设计</h3>\n    <table>\n      <tr>\n        <th>激励类型</th>\n        <th>具体措施</th>\n        <th>效果</th>\n      </tr>\n      <tr>\n        <td>经济回报</td>\n        <td>课酬（保底+销售分成）、课程销售版税（15-30%）</td>\n        <td>核心驱动力，但需合理设计避免讲师过度商业化</td>\n      </tr>\n      <tr>\n        <td>学术影响力</td>\n        <td>平台背书标签、\"特邀讲师\"认证、联合署名课程</td>\n        <td>满足讲师的学术声誉需求</td>\n      </tr>\n      <tr>\n        <td>流量曝光</td>\n        <td>平台首页推荐、公众号宣传、社群推广</td>\n        <td>帮助讲师建立个人品牌</td>\n      </tr>\n      <tr>\n        <td>合作机会</td>\n        <td>优先参与线下培训、课题合作机会、科研资源对接</td>\n        <td>增强讲师粘性，建立长期关系</td>\n      </tr>\n      <tr>\n        <td>便捷工具</td>\n        <td>提供专业PPT模板、录制场地、设备支持</td>\n        <td>降低讲师准备成本，提高配合度</td>\n      </tr>\n    </table>\n  </div>\n\n  <div class=\"section\">\n    <h2>五、课程质量评估标准</h2>\n\n    <h3>5.1 医学培训课程质量评估体系（俺们自己的标准）</h3>\n    <table>\n      <tr>\n        <th>评估维度</th>\n        <th>评估指标</th>\n        <th>权重</th>\n        <th>评分标准</th>\n      </tr>\n      <tr>\n        <td>内容准确性</td>\n        <td>医学信息准确率、参考文献质量</td>\n        <td>25%</td>\n        <td>专家盲审准确率≥98%为合格</td>\n      </tr>\n      <tr>\n        <td>教学设计</td>\n        <td>目标清晰度、知识结构合理性、案例丰富度</td>\n        <td>20%</td>\n        <td>按ADDIE模型评估（分析-设计-开发-实施-评估）</td>\n      </tr>\n      <tr>\n        <td>制作质量</td>\n        <td>画质、音质、字幕准确性、剪辑流畅度</td>\n        <td>15%</td>\n        <td>技术部门质检评分≥85/100</td>\n      </tr>\n      <tr>\n        <td>学习效果</td>\n        <td>完播率、测试通过率、课后满意度评分</td>\n        <td>25%</td>\n        <td>完播率≥60%、满意度≥4.2/5为合格</td>\n      </tr>\n      <tr>\n        <td>实用价值</td>\n        <td>实操可迁移性、学员反馈实用性评分</td>\n        <td>15%</td>\n        <td>课后问卷\"非常实用\"占比≥70%</td>\n      </tr>\n    </table>\n\n    <h3>5.2 课程健康度监控指标</h3>\n    <div class=\"highlight-box\">\n      <table>\n        <tr><th>指标</th><th>健康值</th><th>预警值\n<p style=\"color:#999;text-align:center;padding:20px\">[内容已截断，原文件见 /小动物科研培训平台/ ]</p></div>", "icon": "🎬"}, {"num": 4, "title": "设备码", "html": "<div class=\"container\">\n  <div class=\"header\">\n    <h1>设备码发放渠道报告</h1>\n    <div class=\"subtitle\">小动物科研培训平台 · 医疗器械销售与设备码体系设计 &nbsp;|&nbsp; 2026年3月</div>\n  </div>\n\n  <div class=\"section\">\n    <h2>一、医疗器械（超声/智能笼）销售渠道分析</h2>\n\n    <h3>1.1 医疗器械行业整体渠道结构</h3>\n    <p>中国医疗器械行业销售渠道呈现典型的\"多层分销+直销\"并行结构。超声诊断设备（尤其是高端科研超声）和智能笼等生命科学设备，渠道结构有自己的特点。</p>\n\n    <div class=\"highlight-box\">\n      <strong>超声设备渠道层级：</strong><br>\n      厂商（Manufacturer）→ 一级代理商/总经销商 → 二级经销商 → 区域经销商 → 终端用户（医院/实验室）<br><br>\n      <strong>特点：</strong>科研超声属于高端细分市场，通常采用\"厂商直销+少数核心代理商\"模式，渠道层级少但专业性强。\n    </div>\n\n    <h3>1.2 主要销售渠道类型</h3>\n    <table>\n      <tr>\n        <th>渠道类型</th>\n        <th>占比估算</th>\n        <th>特点</th>\n        <th>适用设备</th>\n        <th>俺们的机会</th>\n      </tr>\n      <tr>\n        <td>厂商直销团队</td>\n        <td>20-30%</td>\n        <td>原厂销售直接对接终端客户，专业度高，利润高</td>\n        <td>高端超声、定制化设备</td>\n        <td>与原厂合作，设备码随设备走</td>\n      </tr>\n      <tr>\n        <td>区域代理商</td>\n        <td>40-50%</td>\n        <td>各地有代理，关系营销为主，熟悉本地客户</td>\n        <td>中高端设备</td>\n        <td>核心渠道伙伴，设备码通过代理发放</td>\n      </tr>\n      <tr>\n        <td>政府采购/招标</td>\n        <td>15-25%</td>\n        <td>高校/医院科研经费采购，流程规范，账期长</td>\n        <td>所有科研设备</td>\n        <td>中标后可捆绑课程销售</td>\n      </tr>\n      <tr>\n        <td>展会/学术会议直销</td>\n        <td>5-10%</td>\n        <td>现场展示+试用，决策周期短，适合建立初期信任</td>\n        <td>所有类型</td>\n        <td>参展时同步推广培训课程</td>\n      </tr>\n      <tr>\n        <td>电商（京东/淘宝企业采购）</td>\n        <td>3-8%</td>\n        <td>价格透明，适合标准化设备，配套服务弱</td>\n        <td>标准化小型设备</td>\n        <td>智能笼等标准化产品可探索</td>\n      </tr>\n      <tr>\n        <td>设备集成商（打包方案）</td>\n        <td>10-15%</td>\n        <td>将多种设备打包成实验室解决方案，含设备+软件+培训</td>\n        <td>整套实验室建设</td>\n        <td>与集成商合作，课程作为增值服务</td>\n      </tr>\n    </table>\n\n    <h3>1.3 超声设备市场主要厂商分析</h3>\n    <table>\n      <tr>\n        <th>品牌</th>\n        <th>定位</th>\n        <th>主要客户</th>\n        <th>渠道模式</th>\n        <th>俺们的合作切入方式</th>\n      </tr>\n      <tr>\n        <td>GE医疗（Vivid系列）</td>\n        <td>高端超声</td>\n        <td>三甲医院、科研机构</td>\n        <td>直销+核心代理</td>\n        <td>GE有专门的生命科学团队，可谈课程合作</td>\n      </tr>\n      <tr>\n        <td>Philips（EPIQ系列）</td>\n        <td>高端超声</td>\n        <td>大型医院、科研</td>\n        <td>核心代理为主</td>\n        <td>代理商渠道合作</td>\n      </tr>\n      <tr>\n        <td>Mindray（迈瑞）</td>\n        <td>中高端</td>\n        <td>各级医院、科研</td>\n        <td>全渠道覆盖</td>\n        <td>国产替代趋势强，渠道合作意愿高</td>\n      </tr>\n      <tr>\n        <td>Esaote（百胜）</td>\n        <td>专科超声</td>\n        <td>宠物医院、科研</td>\n        <td>专业代理</td>\n        <td>小动物超声专项，合作最匹配</td>\n      </tr>\n      <tr>\n        <td>深圳开立医疗</td>\n        <td>中端超声</td>\n        <td>医院、科研</td>\n        <td>代理+直销</td>\n        <td>国产品牌，合作灵活度高</td>\n      </tr>\n      <tr>\n        <td>小动物专用超声（如Vinno等）</td>\n        <td>兽医专用</td>\n        <td>宠物医院、实验室</td>\n        <td>代理+直销</td>\n        <td>与俺们目标市场最匹配，优先合作</td>\n      </tr>\n    </table>\n  </div>\n\n  <div class=\"section\">\n    <h2>二、设备码跟随设备分发的流程设计</h2>\n\n    <h3>2.1 设备码的核心定义与作用</h3>\n    <div class=\"highlight-box\">\n      <strong>设备码（Device License Code）：</strong>与硬件设备绑定的唯一数字许可证，用于解锁对应课程学习权限。设备码是俺们\"设备+内容\"商业模式的连接器——设备卖出即课程卖出，激活设备即激活学习账号。\n    </div>\n\n    <h3>2.2 设备码分发全流程（7步）</h3>\n\n    <div class=\"flow-step\">\n      <div class=\"step-num\">1</div>\n      <div>\n        <strong>厂商/俺们生成设备码批次</strong><br>\n        在后台管理系统中，生成一批设备码（可按批次/型号生成）。每个设备码包含：唯一序列号、设备型号、对应课程包、有效期、发放渠道商信息。\n      </div>\n    </div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">2</div>\n      <div>\n        <strong>设备码与设备物理包装</strong><br>\n        设备码以卡片/说明书形式随设备一起发货，或以短信/邮件形式发送给代理商/终端客户。设备码可以是实体卡片（刮开涂层），也可以是电子码。\n      </div>\n    </div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">3</div>\n      <div>\n        <strong>经销商/终端客户激活设备码</strong><br>\n        客户收到设备后，访问俺们平台网站，输入设备码完成激活。激活时需要：设备码 + 手机号/邮箱 + 简单的用户信息登记（姓名、单位）。\n      </div>\n    </div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">4</div>\n      <div>\n        <strong>设备码与用户账号绑定</strong><br>\n        激活后，设备码关联到用户账号，账号获得对应课程的学习权限。一个设备码可绑定一个主账号（可分享给机构其他成员，限制人数）。\n      </div>\n    </div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">5</div>\n      <div>\n        <strong>课程权限自动解锁</strong><br>\n        绑定成功后，用户在\"我的学习\"中自动看到与该设备对应的课程列表，可立即开始学习。设备码对应的课程包可以是固定套餐，也可以是设备码+充值余额模式（用户自选课程）。\n      </div>\n    </div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">6</div>\n      <div>\n        <strong>设备码使用状态追踪</strong><br>\n        后台实时追踪每个设备码的状态：未激活 / 已激活 / 已过期 / 已退款。设备码与设备SN号可一一对应，便于追溯。\n      </div>\n    </div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">7</div>\n      <div>\n        <strong>售后服务与续费触发</strong><br>\n        设备码激活周年时，系统自动向用户推送：设备维护提醒 + 课程更新通知 + 续费优惠，引导用户转化为长期付费用户。\n      </div>\n    </div>\n\n    <h3>2.3 设备码激活流程示意图</h3>\n    <div class=\"highlight-box\">\n      <table>\n        <tr><th>环节</th><th>操作主体</th><th>操作内容</th><th>系统响应</th></tr>\n        <tr><td>设备出库</td><td>厂商/经销商</td><td>扫描设备SN，关联设备码</td><td>系统记录出库批次</td></tr>\n        <tr><td>客户收货</td><td>终端客户</td><td>收到设备+设备码</td><td>—</td></tr>\n        <tr><td>激活注册</td><td>终端客户</td><td>网站输入设备码+注册账号</td><td>校验设备码有效性</td></tr>\n        <tr><td>权限开通</td><td>系统</td><td>自动解锁对应课程</td><td>发送欢迎邮件/通知</td></tr>\n        <tr><td>学习开始</td><td>终端客户</td><td>观看课程+实操设备</td><td>记录学习行为数据</td></tr>\n        <tr><td>续费转化</td><td>系统+运营</td><td>到期前提醒+推荐更多课程</td><td>CRM触发营销流程</td></tr>\n      </table>\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h2>三、经销商渠道管理方案</h2>\n\n    <h3>3.1 经销商分层管理架构</h3>\n    <table>\n      <tr>\n        <th>经销商级别</th>\n        <th>定义</th>\n        <th>设备码配额</th>\n        <th>折扣政策</th>\n        <th>配套支持</th>\n      </tr>\n      <tr>\n        <td>金牌经销商（全国）</td>\n        <td>年采购额≥500万，覆盖全国</td>\n        <td>不限量，按需申请</td>\n        <td>最低折扣+设备码返还</td>\n        <td>专属客户经理+优先课程定制+联合市场推广</td>\n      </tr>\n      <tr>\n        <td>银牌经销商（区域）</td>\n        <td>年采购额100-500万，单省/多省</td>\n        <td>按季度配额</td>\n        <td>中等折扣</td>\n        <td>区域市场支持+培训课程优先体验</td>\n      </tr>\n      <tr>\n        <td>普通经销商</td>\n        <td>年采购额&lt;100万，单城市/单省</td>\n        <td>按批次申请</td>\n        <td>标准折扣</td>\n        <td>基础物料支持+线上培训</td>\n      </tr>\n      <tr>\n        <td>设备集成商伙伴</td>\n        <td>实验室整体方案商</td>\n        <td>按项目申请</td>\n        <td>项目制议价</td>\n        <td>联合方案设计+培训授权</td>\n      </tr>\n    </table>\n\n    <h3>3.2 经销商设备码管理规范</h3>\n    <div class=\"highlight-box\">\n      <ol>\n        <li><strong>配额管理：</strong>设备码按季度配额发放，经销商需在配额有效期内使用，超额需额外申请。</li>\n        <li><strong>预付款制度：</strong>设备码采用预付款模式（先付款后发货），避免库存积压和渠道乱价。</li>\n        <li><strong>库存查询：</strong>经销商可登录俺们后台，实时查询设备码库存、激活状态、使用分布。</li>\n        <li><strong>跨区管控：</strong>设备码与经销商负责区域绑定，禁止跨区销售（串货），违者扣减配额或取消资格。</li>\n        <li><strong>退货处理：</strong>设备退货时，设备码可申请回收再利用（需系统支持解绑流程）。</li>\n        <li><strong>窜货监控：</strong>系统自动比对设备码激活地址与经销商负责区域，不匹配则触发预警。</li>\n      </ol>\n    </div>\n\n    <h3>3.3 经销商激励政策</h3>\n    <table>\n      <tr>\n        <th>激励类型</th>\n        <th>具体措施</th>\n        <th>效果</th>\n      </tr>\n      <tr>\n        <td>销售返点</td>\n        <td>年采购额超目标部分返2-5%设备码/现金</td>\n        <td>刺激经销商主推俺们的设备</td>\n      </tr>\n      <tr>\n        <td>设备码赠送</td>\n        <td>采购设备达到一定量，额外赠送设备码包</td>\n        <td>让经销商有更多资源服务终端客户</td>\n      </tr>\n      <tr>\n        <td>市场费用支持</td>\n        <td>参展费、推广费报销50%（需事前申请）</td>\n        <td>帮助经销商拓展本地市场</td>\n      </tr>\n      <tr>\n        <td>培训支持</td>\n        <td>为经销商团队提供免费产品培训和课程体验</td>\n        <td>提升经销商团队的专业性</td>\n      </tr>\n      <tr>\n        <td>线索分配</td>\n        <td>平台获取的本地线索优先推荐给当地经销商</td>\n        <td>帮助经销商获客</td>\n      </tr>\n    </table>\n  </div>\n\n  <div class=\"section\">\n    <h2>四、设备批次管理（批次号、有效期控制）</h2>\n\n    <h3>4.1 批次管理系统设计</h3>\n    <p>设备码批次管理是整个体系的基础数据架构，需要精确到每个最小单元。</p>\n\n    <table>\n      <tr>\n        <th>字段</th>\n        <th>说明</th>\n        <th>示例</th>\n      </tr>\n      <tr>\n        <td>批次号</td>\n        <td>同一批生产的设备码集合</td>\n        <td>BATCH-2026-Q1-001</td>\n      </tr>\n      <tr>\n        <td>设备码序列号</td>\n        <td>每个设备的唯一码</td>\n        <td>DC-2026-00001 ~ DC-2026-10000</td>\n      </tr>\n      <tr>\n        <td>设备型号</td>\n        <td>对应设备类型（超声A型/智能笼B型）</td>\n        <td>Sono-A100 / Cage-Smart-V2</td>\n      </tr>\n      <tr>\n        <td>课程包配置</td>\n        <td>该批次设备码对应的课程套餐</td>\n        <td>套餐A（Sono基础课）/ 套餐B（套餐A+进阶课）</td>\n      </tr>\n      <tr>\n        <td>发放日期</td>\n        <td>设备码发放给经销商/客户的时间</td>\n        <td>2026-04-01</td>\n      </tr>\n      <tr>\n        <td>有效期</td>\ntd>激活后有效期限（1年/2年/永久）</td>\n        <td>2027-04-01（激活后1年）</td>\n      </tr>\n      <tr>\n        <td>状态</td>\n        <td>未激活/已激活/已过期/已回收</td>\n        <td>已激活</td>\n      </tr>\n      <tr>\n        <td>归属经销商</td>\n        <td>该设备码发放给的经销商</td>\n        <td>华东区-张三公司</td>\n      </tr>\n      <tr>\n        <td>激活用户</td>\n        <td>激活该码的用户ID</td>\n        <td>USER-2026-88888</td>\n      </tr>\n    </table>\n\n    <h3>4.2 有效期控制策略</h3>\n    <div class=\"highlight-box\">\n      <table>\n        <tr><th>设备码类型</th><th>有效期</th><th>说明</th></tr>\n        <tr><td>基础设备码</td><td>激活后1年</td><td>对应基础课程包，到期需续费</td></tr>\n        <tr><td>高级设备码</td><td>激活后2年</td><td>含基础+进阶课程，续费优惠力度更大</td></tr>\n        <tr><td>企业设备码</td><td>按企业协议约定</td><td>批量授权，可设置机构内共享账号数</td></tr>\n        <tr><td>展示机/评测码</td><td>固定30-90天</td><td>用于经销商演示，不计入正式销售</td></tr>\n        <tr><td>学员试用码</td><td>固定7-14天</td><td>市场推广用，吸引用户体验后再购买</td></tr>\n      </table>\n    </div>\n\n    <h3>4.3 有效期到期处理流程</h3>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">T-30天</div>\n      <div>系统自动发送续费提醒：邮件+短信+站内通知，告知到期时间+续费优惠</div>\n    </div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">T-7天</div>\n      <div>再次提醒，并推送课程更新内容（让用户感受到续费价值）</div>\n    </div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">T=0（到期日）</div>\n      <div>课程权限暂停（不可观看新内容），已下载的离线视频仍可离线观看</div>\n    </div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">T+7天</div>\n      <div>最后催费通知，提供限时续费折扣（8折）</div>\n    </div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">T+30天</div>\n      <div>账号彻底封停，续费需原价。设备码可重新激活（需新续费订单）。</div>\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h2>五、防伪/防串货方案</h2>\n\n    <h3>5.1 防伪技术方案</h3>\n    <table>\n      <tr>\n        <th>防伪手段</th>\n        <th>实现方式</th>\n        <th>成本</th>\n        <th>防护效果</th\n<p style=\"color:#999;text-align:center;padding:20px\">[内容已截断，原文件见 /小动物科研培训平台/ ]</p></div>", "icon": "🔐"}, {"num": 5, "title": "定价策略", "html": "<div class=\"container\">\n  <div class=\"header\">\n    <h1>定价策略报告</h1>\n    <div class=\"subtitle\">小动物科研培训平台 · 课程定价与商业模式设计 &nbsp;|&nbsp; 2026年3月</div>\n  </div>\n\n  <div class=\"section\">\n    <h2>一、医学培训类课程行业定价参考</h2>\n\n    <h3>1.1 行业整体定价格局</h3>\n    <p>医学/兽医在线教育定价受内容深度、目标用户、平台品牌、课程形式等多重因素影响。俺们先梳理行业标杆，建立定价坐标系。</p>\n\n    <table>\n      <tr>\n        <th>平台类型</th>\n        <th>定价区间</th>\n        <th>单课均价</th>\n        <th>年费会员价</th>\n        <th>数据来源</th>\n      </tr>\n      <tr>\n        <td>大众医学科普平台（丁香医生等）</td>\n        <td>免费+低价</td>\n        <td>9-99元</td>\n        <td>—</td>\n        <td>公开定价</td>\n      </tr>\n      <tr>\n        <td>医学专业继续教育（好医术等）</td>\n        <td>中等偏高</td>\n        <td>200-1000元</td>\n        <td>2000-5000元</td>\n        <td>官网定价</td>\n      </tr>\n      <tr>\n        <td>医学考研/执考培训（新东方等）</td>\n        <td>中等</td>\n        <td>100-500元</td>\n        <td>3000-8000元</td>\n        <td>官网定价</td>\n      </tr>\n      <tr>\n        <td>宠物临床培训（宠医客）</td>\n        <td>中等偏高</td>\n        <td>50-500元</td>\n        <td>800-1500元</td>\n        <td>官网估算</td>\n      </tr>\n      <tr>\n        <td>兽医影像专项（宠医课堂）</td>\n        <td>偏高</td>\n        <td>200-800元</td>\n        <td>1500-3000元</td>\n        <td>官网估算</td>\n      </tr>\n      <tr>\n        <td>国际兽医学分平台（VetBloom）</td>\n        <td>高（美元）</td>\n        <td>50-300美元</td>\n        <td>399-799美元</td>\n        <td>官网定价</td>\n      </tr>\n      <tr>\n        <td>实验动物法规培训（国内机构）</td>\n        <td>低</td>\n        <td>0-500元</td>\n        <td>—</td>\n        <td>行业调研</td>\n      </tr>\n    </table>\n\n    <h3>1.2 定价的关键影响因素</h3>\n    <div class=\"highlight-box\">\n      <ol>\n        <li><strong>内容独家性：</strong>越是稀缺、独家、难以复制的内容，定价空间越大。科研超声应用是稀缺内容，可适当溢价。</li>\n        <li><strong>目标用户付费能力：</strong>科研用户（PI、药企）付费能力强，可接受较高价格；学生用户价格敏感，需要分层定价。</li>\n        <li><strong>课程形式：</strong>直播课 > 系列录播 > 单节录播；实操演示 > 理论讲解。</li>\n        <li><strong>配套服务：</strong>有答疑、作业、证书的课程可定价更高。</li>\n        <li><strong>设备绑定属性：</strong>与设备绑定的课程，用户购买决策与设备采购挂钩，价格敏感度相对低。</li>\n        <li><strong>竞品定价锚点：</strong>用户会与竞品比价，俺们的定价需要在竞品价格区间内具有竞争力。</li>\n      </ol>\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h2>二、按课程类型的定价方式</h2>\n\n    <h3>2.1 单课定价模型</h3>\n    <table>\n      <tr>\n        <th>课程类型</th>\n        <th>建议定价区间</th>\n        <th>定价依据</th>\n        <th>备注</th>\n      </tr>\n      <tr>\n        <td>理论讲解类（录播，20-30分钟）</td>\n        <td>49-99元</td>\n        <td>内容浅、制作成本低、用户接受度高</td>\n        <td>引流/入门课定位</td>\n      </tr>\n      <tr>\n        <td>理论讲解类（录播，45-60分钟）</td>\n        <td>99-199元</td>\n        <td>标准课时，深度适中</td>\n        <td>主力单课定价</td>\n      </tr>\n      <tr>\n        <td>实操演示类（录播，30-60分钟）</td>\n        <td>199-399元</td>\n        <td>实操内容稀缺，制作成本高</td>\n        <td>核心差异化课程</td>\n      </tr>\n      <tr>\n        <td>系列课程包（10节录播）</td>\n        <td>699-1499元</td>\n        <td>打包优惠，约单课7-8折</td>\n        <td>鼓励用户买全套</td>\n      </tr>\n      <tr>\n        <td>直播课（实时互动）</td>\n        <td>299-599元/节</td>\n        <td>互动价值，可溢价30-50%</td>\n        <td>小班直播更贵</td>\n      </tr>\n      <tr>\n        <td>直播系列课（8节）</td>\n        <td>1599-2999元</td>\n        <td>高互动+答疑，价值感强</td>\n        <td>高端产品线</td>\n      </tr>\n      <tr>\n        <td>文档/SOP类资料</td>\n        <td>29-99元/份</td>\n        <td>标准化文档，边际成本低</td>\n        <td>辅助内容产品</td>\n      </tr>\n      <tr>\n        <td>AI辅助学习（暂不上）</td>\n        <td>—</td>\n        <td>未来方向，可溢价100-200%</td>\n        <td>预留定价空间</td>\n      </tr>\n    </table>\n\n    <h3>2.2 课程类型定价策略建议</h3>\n    <div class=\"highlight-box\">\n      <strong>引流课策略：</strong>推出少量9.9-29.9元超低价入门课（如\"超声基础7日营\"），目的是吸引用户体验，建立用户池，再通过后续课程包/年费转化。<br><br>\n      <strong>利润课策略：</strong>核心差异化课程（实操演示、科研应用专项）定价199-399元/节，品质驱动，不打价格战。<br><br>\n      <strong>防御课策略：</strong>高频刚需课（实验动物法规、资格证备考）定价亲民49-99元，作用是获取用户接触频次，而非利润。\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h2>三、按设备类型的差异化定价</h2>\n\n    <h3>3.1 超声设备相关课程定价</h3>\n    <p>超声是俺们的核心品类，用户付费意愿高（超声设备本身价值高，对应用户科研经费充足），可以适当溢价。</p>\n    <table>\n      <tr>\n        <th>设备类型</th>\n        <th>配套课程包</th>\n        <th>设备码定价</th>\n        <th>单课零售价</th>\n        <th>年费会员折扣</th>\n      </tr>\n      <tr>\n        <td>基础超声设备</td>\n        <td>基础操作+扫查手法（8节）</td>\n        <td>随设备附赠，含1年权限</td>\n        <td>99-199元/节</td>\n        <td>8折</td>\n      </tr>\n      <tr>\n        <td>中端科研超声</td>\n        <td>基础+科研应用（15节）</td>\n        <td>随设备附赠，含2年权限</td>\n        <td>199-399元/节</td>\n        <td>7.5折</td>\n      </tr>\n      <tr>\n        <td>高端心脏/科研超声</td>\n        <td>全系列+高阶专项（25节+）</td>\n        <td>随设备附赠，含3年权限</td>\n        <td>299-599元/节</td>\n        <td>7折</td>\n      </tr>\n    </table>\n\n    <h3>3.2 智能笼/其他设备课程定价</h3>\n    <table>\n      <tr>\n        <th>设备类型</th>\n        <th>配套课程包</th>\n        <th>设备码定价</th>\n        <th>单课零售价</th>\n        <th>备注</th>\n      </tr>\n      <tr>\n        <td>智能笼（基础版）</td>\n        <td>操作指南+数据解读（5节）</td>\n        <td>随设备附赠，含1年权限</td>\n        <td>49-99元/节</td>\n        <td>设备价值相对低，课程定价也低</td>\n      </tr>\n      <tr>\n        <td>智能笼（科研版）</td>\n        <td>操作+数据采集+科研应用（10节）</td>\n        <td>随设备附赠，含2年权限</td>\n        <td>99-199元/节</td>\n        <td>与设备采购绑定，价值感强</td>\n      </tr>\n      <tr>\n        <td>配套试剂/耗材包</td>\n        <td>使用规范+注意事项（2-3节）</td>\n        <td>附赠或低价捆绑</td>\n        <td>29-59元/节</td>\n        <td>辅助内容，提高客单价</td>\n      </tr>\n    </table>\n\n    <h3>3.3 设备码价值量化</h3>\n    <div class=\"highlight-box\">\n      俺们建议将设备码的\"课程价值\"显性化地告诉用户：<br><br>\n      <table>\n        <tr><th>设备码类型</th><th>含课程零售总价</th><th>设备码定价</th><th>用户感知\"占便宜\"幅度</th></tr>\n        <tr><td>基础设备码</td><td>800-1600元</td><td>含在设备价格内</td><td>设备总价中隐含了800-1600元课程</td></tr>\n        <tr><td>高级设备码</td><td>2000-4000元</td><td>含在设备价格内</td><td>高端设备的溢价空间可覆盖更多课程</td></tr>\n        <tr><td>单独购买设备码</td><td>—</td><td>499-999元/个</td><td>无设备用户可单独购买</td></tr>\n      </table>\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h2>四、年费 vs 单课购买的定价模型</h2>\n\n    <h3>4.1 年费会员体系设计</h3>\n    <div class=\"pricing-card recommended\">\n      <h3>🥇 黄金会员（年费）</h3>\n      <div class=\"price\">¥1299<span class=\"unit\">/年</span></div>\n      <p>• 平台全部基础课程（200+节）无限观看<br>\n      • 每月2节新课优先体验<br>\n      • 课程笔记/重点标注功能<br>\n      • 专属客服响应（24小时）<br>\n      • 结业证书（每年最多3张）<br>\n      • 早鸟价/团购折扣资格<br>\n      • 续费优惠：第二年999元</p>\n    </div>\n\n    <div class=\"pricing-card\">\n      <h3>🥈 铂金会员（年费）</h3>\n      <div class=\"price\">¥2999<span class=\"unit\">/年</span></div>\n      <p>• 黄金会员全部权益<br>\n      • 全部课程（含高端实操课、系列课）无限观看<br>\n      • 每年12节直播课免费参与（含回放）<br>\n      • 专家1对1答疑（每年6次，每次30分钟）<br>\n      • 结业证书（每年10张）<br>\n      • 优先参与线下实操培训（享优惠价）<br>\n      • 续费优惠：第二年2499元</p>\n    </div>\n\n    <div class=\"pricing-card\">\n      <h3>🥉 企业账号（年费）</h3>\n      <div class=\"price\">¥9999<span class=\"unit\">/年起（5人）</span></div>\n      <p>• 铂金会员全部权益（每人独立账号）<br>\n      • 机构专属学习报告<br>\n      • 批量课程定制优先权<br>\n      • 机构认证标识<br>\n      • 专属客户成功经理<br>\n      • 可扩展席位（超5人享受阶梯折扣）<br>\n      • 续费优惠：长期合约可议价</p>\n    </div>\n\n    <h3>4.2 单课 vs 年费 对比分析</h3>\n    <table>\n      <tr>\n        <th>对比维度</th>\n        <th>单课购买</th>\n        <th>年费会员</th>\n      </tr>\n      <tr>\n        <td>适用用户</td>\n        <td>需求明确、只需特定课程的用户</td>\n        <td>学习需求广、计划长期学习的用户</td>\n      </tr>\n      <tr>\n        <td>价格感知</td>\n        <td>灵活，但累加成本高</td>\n        <td>一次付出大，但均摊低</td>\n      </tr>\n      <tr>\n        <td>典型用户</td>\n        <td>研究生（价格敏感）、一次性学习者</td>\n        <td>PI、机构、资深从业者</td>\n      </tr>\n      <tr>\n        <td>平台收益</td>\n        <td>短期现金流好，但用户生命周期短</td>\n        <td>长期用户粘性高，LTV更高</td>\n      </tr>\n      <tr>\n        <td>决策门槛</td>\n        <td>低（几十到几百元）</td>\n        <td>高（千元以上）</td>\n      </tr>\n      <tr>\n        <td>俺们的策略</td>\n        <td>满足长尾需求，作为年费的补充</td>\n        <td>核心营收模式，主推转化</td>\n      </tr>\n    </table>\n\n    <h3>4.3 定价心理学技巧</h3>\n    <div class=\"highlight-box\">\n      <ol>\n        <li><strong>锚定效应：</strong>先展示原价（¥2999），再展示优惠价（¥1299），用户感知到的价值更大。</li>\n        <li><strong>诱饵选项：</strong>设置一个\"鸡肋\"选项（铂金会员），让黄金会员显得更值得买。</li>\n        <li><strong>免费试用：</strong>提供7天免费体验，让用户先用再买，降低决策门槛。</li>\n        <li><strong>限时折扣：</strong>早鸟价、限时优惠制造紧迫感，驱动快速决策。</li>\n        <li><strong>赠送体验：</strong>买年费会员赠送实物（如设备操作手册U盘），增加感知价值。</li>\n        <li><strong>续费优惠：</strong>第二年续费折扣（8折），锁定长期用户，提高续费率。</li>\n      </ol>\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h2>五、早鸟价/团购等促销策略设计</h2>\n\n    <h3>5.1 早鸟价策略</h3>\n    <table>\n      <tr>\n        <th>活动类型</th>\n        <th>折扣力度</th>\n        <th>适用场景</th>\n        <th>持续时间</th>\n        <th>注意风险</th>\n      </tr>\n      <tr>\n        <td>新课程首发早鸟</td>\n        <td>7-8折</td>\n        <td>新系列课/大型课程上线</td>\n        <td>上线前2周/后1周</td>\n        <td>早鸟结束后要恢复原价，避免用户等打折</td>\n      </tr>\n      <tr>\n        <td>年费会员早鸟</td>\n        <td>8-8.5折（限时）</td>\n        <td>会员日到周年庆</td>\n        <td>每年固定1-2次</td>\n        <td>提前预告，制造期待感</td>\n      </tr>\n      <tr>\n        <td>限时秒杀</td>\n        <td>5-6折（限量）</td>\n        <td>引流获客、激活沉默用户</td>\n        <td>每周1次，每次24-48小时</td>\n        <td>控制数量，保持稀缺感</td>\n      </tr>\n      <tr>\n        <td>节日促销</td>\n        <td>8-9折</td>\n        <td>双11/618/春节/开学季</td>\n        <td>节日前后1周</td>\n        <td>不要过于频繁，避免价格体系崩塌</td>\n      </tr>\n    </table>\n\n    <h3>5.2 团购策略</h3>\n    <div class=\"highlight-box\">\n      <table>\n        <tr><th>团购类型</th><th>成团人数</th><th>折扣</th><th>适用课程</th><th>说明</th></tr>\n        <tr><td>小团</td><td>3-5人</td><td>9折</td><td>所有课程</td><td>适合课题组/实验室同学一起买</td></tr>\n        <tr><td>中团</td><td>6-10人</td><td>8折</td><td>年费会员/系列课</td><td>适合小型机构采购</td></tr>\n        <tr><td>大团</td><td>11-30人</td><td>7折</td><td>企业账号</td><td>适合中型实验室/科室采购</td></tr>\n        <tr><td>超级团</td><td>30人+</td><td>6折起</td><td>定制企业方案</td><td>需要销售一对一定价</td></tr>\n      </table>\n    </div>\n\n    <h3>5.3 推荐有礼（裂变机制）</h3>\n    <table>\n      <tr>\n        <th>机制</th>\n        <th>规则</th>\n        <th>奖励</th>\n        <th>说明</th>\n      </tr>\n      <tr>\n        <td>邀请好友买课</td>\n        <td>每邀请1人购买年费会员</td>\n        <td>邀请人获100元课程代金券</td>\n        <td>被邀请人也有首单优惠</td>\n      </tr>\n      <tr>\n        <td>邀请好友买年费</td>\n        <td>每邀请1人购买年费会员</td>\n        <td>邀请人延长1个月会员期</td>\n        <td>增加用户粘性</td>\n      </tr>\n      <tr>\n        <td>机构推荐</td>\n        <td>机构账号成员推荐新机构</td>\n        <td>机构获额外5个账号席位</td>\n        <td>适合B端裂变</td>\n      </tr>\n      <tr>\n        <td>内容裂变</td>\n        <td>分享课程片段到朋友圈/群</td>\n        <td>解锁课程额外章节</td>\n        <td>低成本\n<p style=\"color:#999;text-align:center;padding:20px\">[内容已截断，原文件见 /小动物科研培训平台/ ]</p></div>", "icon": "💰"}, {"num": 6, "title": "合规资质", "html": "<div class=\"container\">\n  <div class=\"header\">\n    <h1>合规资质报告</h1>\n    <div class=\"subtitle\">小动物科研培训平台 · 医疗培训合规红线与资质申请清单 &nbsp;|&nbsp; 2026年3月</div>\n  </div>\n  <div class=\"section\">\n    <h2>一、合规风险概述</h2>\n    <p>本平台涉及动物医疗培训，属医疗健康赛道，合规风险极高。以下两项为最高风险项，必须在产品设计阶段解决：</p>\n    <div class=\"risk-box\" style=\"background:#fee2e2;border:1px solid #dc2626;border-radius:8px;padding:16px;margin:12px 0\">\n      <strong style=\"color:#dc2626\">⚠️ 最高风险（两项）</strong>\n      <ul style=\"margin:8px 0 0 20px;font-size:13px;color:#555\">\n        <li><strong>直播中出现患者/动物主人隐私</strong>：演示病例未脱敏，评分「高概率 × 高影响」</li>\n        <li><strong>AI 给出诊断建议</strong>：问诊类 AI 功能可能被视为医疗器械，评分「高概率 × 高影响」</li>\n      </ul>\n    </div>\n  </div>\n  <div class=\"section\">\n    <h2>二、必须具备的资质</h2>\n    <table>\n      <tr><th>资质名称</th><th>申请难度</th><th>预计周期</th><th>说明</th></tr>\n      <tr><td>ICP 备案</td><td>低</td><td>15-30 天</td><td>网站必备，工信部免费申请</td></tr>\n      <tr><td>ICP 许可证</td><td>中</td><td>60-90 天</td><td>涉及收费需申请，注册资金≥100万</td></tr>\n      <tr><td>网络文化经营许可证</td><td>高</td><td>30-60 天</td><td>录制课/直播类目需申请</td></tr>\n      <tr><td>广播电视节目制作许可证</td><td>高</td><td>30-60 天</td><td>视频内容制作/发布需申请</td></tr>\n      <tr><td>医疗器械广告审查</td><td>高</td><td>30 天</td><td>涉及医疗器械宣传需申请</td></tr>\n    </table>\n  </div>\n  <div class=\"section\">\n    <h2>三、直播合规操作规程</h2>\n    <ul>\n      <li>直播前：讲师须签署《内容合规承诺书》，声明所有病例已获授权或已脱敏</li>\n      <li>直播中：必须开启延迟播放（建议 30 秒），人工巡检员实时监控</li>\n      <li>AI 预审：引入 AI 内容审核模型，对弹幕/评论进行实时过滤</li>\n      <li>直播后：录像须经人工审核后方可对外展示</li>\n    </ul>\n  </div>\n  <div class=\"section\">\n    <h2>四、避坑指南</h2>\n    <ul>\n      <li>不要在课程中展示未经授权的真实患者照片/病历</li>\n      <li>AI 问答功能只给参考性建议，必须有「本产品不构成医疗建议」免责声明</li>\n      <li>不得在未取得资质的情况下宣传「治疗」「治愈」等医疗效果词汇</li>\n      <li>超声/影像设备教学须注明「仅供培训使用，不作为临床诊断依据」</li>\n    </ul>\n  </div>\n</div>", "icon": "⚠️"}, {"num": 7, "title": "域名品牌", "html": "<div class=\"container\">\n  <div class=\"header\">\n    <h1>域名与品牌报告</h1>\n    <div class=\"subtitle\">小动物科研培训平台 · 域名选择与品牌命名建议 &nbsp;|&nbsp; 2026年3月</div>\n  </div>\n  <div class=\"section\">\n    <h2>一、域名选择建议</h2>\n    <p>域名是品牌的核心资产，建议按以下优先级选择：</p>\n    <table>\n      <tr><th>优先级</th><th>域名类型</th><th>示例</th><th>说明</th></tr>\n      <tr><td>P0</td><td>.com 全拼</td><td>xiaodongwu.com</td><td>最理想，用户信任度最高</td></tr>\n      <tr><td>P0</td><td>.cn 全拼</td><td>xiaodongwu.cn</td><td>国内首选，备案便捷</td></tr>\n      <tr><td>P1</td><td>关键词.com</td><td>vetlearn.com / animaltraining.com</td><td>SEO友好，需确认可注册</td></tr>\n      <tr><td>P2</td><td>品牌名.com</td><td>自定义品牌词.com</td><td>待定，需商标检索</td></tr>\n    </table>\n    <p style=\"margin-top:12px;font-size:12px;color:#999\">注意：.com/.cn 可注册性需在确定名称后立即查询，热门关键词可能被抢注。</p>\n  </div>\n  <div class=\"section\">\n    <h2>二、ICP 备案流程</h2>\n    <p>国内网站必须完成 ICP 备案方可绑定国内服务器：</p>\n    <ul>\n      <li><strong>个人备案</strong>：资料简单，5-10 个工作日，仅限非盈利内容</li>\n      <li><strong>企业备案</strong>：需营业执照，15-30 个工作日，可开展收费业务</li>\n      <li><strong>备案期间</strong>：可临时使用香港/海外服务器保持访问</li>\n    </ul>\n    <p style=\"margin-top:10px\">建议：提前准备企业营业执照（注册资金建议≥100万以满足ICP许可证条件）。</p>\n  </div>\n  <div class=\"section\">\n    <h2>三、品牌命名方向</h2>\n    <ul>\n      <li><strong>学术路线</strong>：小动物医学培训平台 / 兽医继续教育网</li>\n      <li><strong>平台路线</strong>：小动物科研在线 / 兽医培训频道</li>\n      <li><strong>设备路线</strong>：设备码学院 / 影像大师</li>\n    </ul>\n    <p style=\"margin-top:10px\">建议品牌名兼顾专业感与亲和力，避免过于学术导致用户距离感。</p>\n  </div>\n</div>", "icon": "🌐"}, {"num": 8, "title": "推广获客", "html": "<div class=\"container\">\n  <div class=\"header\">\n    <h1>推广获客报告</h1>\n    <div class=\"subtitle\">小动物科研培训平台 · 冷启动策略与流量获取路径 &nbsp;|&nbsp; 2026年3月</div>\n  </div>\n  <div class=\"section\">\n    <h2>一、核心获客逻辑</h2>\n    <p>本平台差异化核心是「设备码 + 医学数据库」，推广策略围绕这一核心展开：</p>\n    <ul>\n      <li><strong>设备渠道地推</strong>：与设备经销商合作，购买设备附赠课程兑换码（低成本获客）</li>\n      <li><strong>兽医 KOL</strong>：邀请头部兽医博主合作，制作超声检查教学短视频</li>\n      <li><strong>SEO 内容</strong>：「犬超声入门」「猫腹腔超声教程」等长尾词，占领百度搜索</li>\n      <li><strong>行业社群</strong>：兽医微信群、知乎专栏、B站兽医分区精准投放</li>\n    </ul>\n  </div>\n  <div class=\"section\">\n    <h2>二、冷启动方案（0-3个月）</h2>\n    <table>\n      <tr><th>渠道</th><th>投入</th><th>预计获客</th><th>优先级</th></tr>\n      <tr><td>设备经销商合作</td><td>低（课程分成）</td><td>50-200 人/月</td><td>★★★★★</td></tr>\n      <tr><td>B站/抖音教学视频</td><td>中（视频制作¥5000）</td><td>100-500 人/月</td><td>★★★★</td></tr>\n      <tr><td>兽医社群投放</td><td>低（人工）</td><td>30-100 人/月</td><td>★★★</td></tr>\n      <tr><td>百度/微信搜索广告</td><td>高（¥2万/月起）</td><td>200-500 人/月</td><td>★★★</td></tr>\n    </table>\n  </div>\n  <div class=\"section\">\n    <h2>三、增长飞轮设计</h2>\n    <ul>\n      <li>用户购买设备 → 获得课程兑换码 → 注册平台 → 形成学习习惯</li>\n      <li>学习过程中 → 分享课程获取更多权限 → 口碑传播</li>\n      <li>进阶用户 → 成为课程创作者 → 平台内容生态</li>\n    </ul>\n  </div>\n</div>", "icon": "📣"}, {"num": 9, "title": "支付接入", "html": "<div class=\"container\">\n  <div class=\"header\">\n    <h1>支付接入报告</h1>\n    <div class=\"subtitle\">小动物科研培训平台 · 微信/支付宝接入与手续费测算 &nbsp;|&nbsp; 2026年3月</div>\n  </div>\n  <div class=\"section\">\n    <h2>一、支付方式选择</h2>\n    <p>国内在线教育平台主流支付方式：</p>\n    <table>\n      <tr><th>支付方式</th><th>接入难度</th><th>手续费率</th><th>备注</th></tr>\n      <tr><td>微信支付</td><td>低</td><td>0.6%</td><td>必须，企业账户</td></tr>\n      <tr><td>支付宝</td><td>低</td><td>0.6%</td><td>必须，企业账户</td></tr>\n      <tr><td>微信分账</td><td>中</td><td>0.6%+0.1%</td><td>用于给讲师分账</td></tr>\n      <tr><td>对公转账</td><td>无</td><td>0</td><td>适合大额/机构采购</td></tr>\n    </table>\n  </div>\n  <div class=\"section\">\n    <h2>二、手续费测算</h2>\n    <ul>\n      <li>月销售额 ¥5 万：手续费约 ¥300/月</li>\n      <li>月销售额 ¥20 万：手续费约 ¥1,200/月</li>\n      <li>月销售额 ¥100 万：手续费约 ¥6,000/月</li>\n    </ul>\n    <p style=\"margin-top:10px\">初期规模较小，手续费占比可控。收入增长后手续费绝对值增加，但规模效应显著。</p>\n  </div>\n  <div class=\"section\">\n    <h2>三、接入方案</h2>\n    <p>推荐使用 <strong>Ping++</strong> 或 <strong>Xor Pay</strong> 聚合支付，一套接口对接微信/支付宝/银联：</p>\n    <ul>\n      <li>个人开发者：可使用收款码模式（低费率，但有限额）</li>\n      <li>企业开发者：建议直接对接微信商户API，手续费更低，功能更全</li>\n      <li>教育类目特殊：需在微信商户平台申请「教育-在线课程」类目，享受0.6%优惠费率</li>\n    </ul>\n  </div>\n  <div class=\"section\">\n    <h2>四、税务注意事项</h2>\n    <ul>\n      <li>企业账户收款需开具发票，建议对接自动化开票系统</li>\n      <li>个人账户收款需关注个人所得税年度汇算</li>\n      <li>机构采购需提供增值税专用发票</li>\n    </ul>\n  </div>\n</div>", "icon": "💳"}, {"num": 10, "title": "运维保障", "html": "<div class=\"wrap\">\n\n<!-- 报头 -->\n<div class=\"hdr\">\n  <div class=\"sub\"><span class=\"tag\">调研报告 10/10</span>村口情报社 · 2026年3月26日</div>\n  <h1>运维保障方案</h1>\n  <div class=\"sub\">小动物科研培训网站 — 支撑 500~2000 用户规模的技术保障体系</div>\n</div>\n\n<!-- 综合说明 -->\n<div class=\"card\">\n  <h2>10.1 概述：运维的核心挑战</h2>\n  <p>小动物科研培训网站是典型的<strong>\"视频+直播+会员制\"</strong>平台，跟普通官网不一样，它有几个运维难点：</p>\n  <ul>\n    <li><strong>视频流量突发：</strong>直播开播时流量瞬间冲高，是日常的 10-50 倍，CDN 和带宽要能扛住</li>\n    <li><strong>内容防盗要求高：</strong>培训课程是核心资产，盗录盗播直接伤害收入</li>\n    <li><strong>医疗内容合规：</strong>内容出现违规（如患者隐私）要能快速下架和溯源</li>\n    <li><strong>需要 7×24 初步监控：</strong>但团队小，不可能专人 24 小时盯着</li>\n    <li><strong>数据安全：</strong>用户账号、设备码、订单数据不能丢也不能泄露</li>\n  </ul>\n  <div class=\"info\">\n    <strong>前提假设：</strong>技术团队 3-5 人（含前端、后端、运维），没有专职运维工程师。运维工作由后端开发人员兼顾，但需要系统化的工具和流程保障。\n  </div>\n</div>\n\n<!-- 监控方案 -->\n<div class=\"card\">\n  <h2>10.2 监控方案：出了事第一时间知道</h2>\n\n  <h3>10.2.1 腾讯云自带监控（必开）</h3>\n  <p>腾讯云控制台有免费的云监控（Cloud Monitor），建议全部开启：</p>\n  <table>\n    <tr><th>监控对象</th><th>监控指标</th><th>告警阈值建议</th><th>通知方式</th></tr>\n    <tr><td>云服务器 CVM</td><td>CPU 使用率 &gt; 80%、内存 &gt; 85%、磁盘 &gt; 80%</td><td>任一指标持续 5 分钟超阈值</td><td>邮件 + 短信</td></tr>\n    <tr><td>云数据库 MySQL</td><td>CPU &gt; 70%、连接数 &gt; 80%、磁盘 &gt; 75%</td><td>任一指标持续 3 分钟</td><td>邮件 + 短信</td></tr>\n    <tr><td>Redis</td><td>内存使用率 &gt; 80%、QPS 异常</td><td>持续 2 分钟</td><td>邮件 + 短信</td></tr>\n    <tr><td>CLB 负载均衡</td><td>后端服务器不可用数量 &gt; 1</td><td>立即告警</td><td>电话 + 短信</td></tr>\n    <tr><td>VOD 视频服务</td><td>视频上传/转码失败率 &gt; 5%</td><td>持续 10 分钟</td><td>邮件</td></tr>\n    <tr><td>CSS 直播服务</td><td>直播流中断、码率异常</td><td>立即告警</td><td>电话 + 短信</td></tr>\n    <tr><td>COS 对象存储</td><td>API 错误率 &gt; 1%</td><td>持续 5 分钟</td><td>邮件</td></tr>\n    <tr><td>CDN</td><td>命中率 &lt; 80%、5xx 错误率 &gt; 2%</td><td>持续 10 分钟</td><td>邮件</td></tr>\n  </table>\n\n  <h3>10.2.2 业务层监控（必须自建）</h3>\n  <p>云监控只能看云资源，业务层面的问题（代码 Bug、接口慢）要自己埋点：</p>\n  <table>\n    <tr><th>监控项</th><th>工具方案</th><th>免费方案</th><th>说明</th></tr>\n    <tr><td>接口可用率</td><td>Prometheus + Grafana</td><td>腾讯云 APM（免费配额）</td><td>统计每个 API 的成功率</td></tr>\n    <tr><td>接口响应时间</td><td>SkyWalking / Zipkin</td><td>腾讯云 APM</td><td>P99 &gt; 2s 要关注</td></tr>\n    <tr><td>错误日志</td><td>ELK（ElasticSearch）</td><td>腾讯云日志服务（CLS）</td><td>Python/Go 报错实时采集</td></tr>\n    <tr><td>用户访问</td><td>Google Analytics / 百度统计</td><td>免费</td><td>看 UV/PV/留存</td></tr>\n    <tr><td>视频播放质量</td><td>VOD 控制台数据</td><td>免费</td><td>卡顿率、播放失败率</td></tr>\n    <tr><td>直播质量</td><td>CSS 控制台数据</td><td>免费</td><td>并发人数、带宽峰值</td></tr>\n  </table>\n\n  <h3>10.2.3 告警通知策略</h3>\n  <div class=\"r2\">\n    <div>\n      <h4>告警分级</h4>\n      <ul>\n        <li><span class=\"bdg bdg-r\">P0 紧急</span>网站完全打不开、数据库挂了 → 电话 + 短信 + 微信（立刻处理）</li>\n        <li><span class=\"bdg bdg-y\">P1 严重</span>部分功能失效、视频无法播放 → 短信 + 邮件（30分钟内处理）</li>\n        <li><span class=\"bdg bdg-b\">P2 一般</span>非核心接口慢、日志有错误 → 邮件（工作时间处理）</li>\n        <li><span class=\"bdg bdg-g\">P3 提示</span>CDN 命中率下降、存储接近阈值 → 忽略或记录</li>\n      </ul>\n    </div>\n    <div>\n      <h4>通知渠道</h4>\n      <ul>\n        <li><strong>白天（9:00-22:00）：</strong>微信/Telegram 群推送</li>\n        <li><strong>夜间（22:00-9:00）：</strong>手机短信 + 电话（P0 才打）</li>\n        <li><strong>非工作时间 P1：</strong>邮件 + 微信，等人响应，超过 1 小时自动升级 P0</li>\n      </ul>\n    </div>\n  </div>\n  <div class=\"warn\">\n    <strong>建议接入腾讯云云监控 + 企点/微信通知。</strong>不要用个人邮箱做告警，检查率太低。建议用 <code>serverless</code> 函数做告警转发，把腾讯云告警转发到钉钉/飞书/ Telegram 机器人。\n  </div>\n</div>\n\n<!-- 数据备份 -->\n<div class=\"card\">\n  <h2>10.3 数据备份方案：数据丢了就完了</h2>\n\n  <h3>10.3.1 备份策略总览</h3>\n  <table>\n    <tr><th>数据类型</th><th>备份方式</th><th>备份频率</th><th>保留时间</th><th>恢复目标</th></tr>\n    <tr><td>数据库（MySQL）</td><td>自动备份 + binlog</td><td>每日全量 + 实时 binlog</td><td>30天</td><td>RTO &lt; 1小时</td></tr>\n    <tr><td>Redis 数据</td><td>RDB 快照</td><td>每15分钟</td><td>7天</td><td>RTO &lt; 30分钟</td></tr>\n    <tr><td>用户上传文件（COS）</td><td>COS 跨区域复制</td><td>实时同步</td><td>同源保留</td><td>手动切换</td></tr>\n    <tr><td>视频文件（VOD）</td><td>VOD 自带多副本</td><td>默认3副本</td><td>永久</td><td>由腾讯云保障</td></tr>\n    <tr><td>代码/配置</td><td>Git 仓库</td><td>每次发布同步</td><td>永久</td><td>随时拉取</td></tr>\n    <tr><td>SSL 证书</td><td>本地 + 云端双存</td><td>每次更新备份</td><td>有效期+1年</td><td>手动</td></tr>\n    <tr><td>日志文件（CLS）</td><td>日志服务保留</td><td>实时上传</td><td>30天</td><td>控制台查询</td></tr>\n  </table>\n\n  <h3>10.3.2 数据库备份详细方案</h3>\n  <p>MySQL 用腾讯云数据库 MySQL（CDB），自带自动备份能力，但需要确认配置：</p>\n  <ul>\n    <li><strong>自动备份：</strong>腾讯云每天自动全量备份，保留 7-30 天（可配置）</li>\n    <li><strong>binlog 备份：</strong>开启 binlog，用于 Point-in-Time Recovery（PITR），恢复到任意时间点</li>\n    <li><strong>手动快照：</strong>大版本发布前手动做一次快照备份，保留 30 天</li>\n    <li><strong>备份存储：</strong>备份文件自动存到 COS，跨地域保存，防止单点故障</li>\n  </ul>\n  <div class=\"ok\">\n    <strong>推荐配置：</strong>每日 02:00 自动全量备份 + 开启 binlog + 备份到 COS 广州+上海异地副本。月费用约 <strong>¥50-100</strong>（COS 存储费）。\n  </div>\n\n  <h3>10.3.3 异地容灾方案</h3>\n  <p>最简单的容灾方案：不追求实时切换，但确保数据不丢。</p>\n  <div class=\"r2\">\n    <div>\n      <h4>方案A：低配版（推荐小团队）</h4>\n      <ul>\n        <li>数据库：腾讯云广州主节点，MySQL 自动备份到 COS 冷存储</li>\n        <li>Redis：广州节点，RDB 快照备份到 COS</li>\n        <li>文件：COS 自动跨区复制（北京/上海二选一）</li>\n        <li>代码：GitHub + 腾讯云 Coding 双仓</li>\n      </ul>\n      <p>故障时：从 COS 拉备份恢复，预计 2-4 小时。</p>\n    </div>\n    <div>\n      <h4>方案B：进阶版（2000+用户）</h4>\n      <ul>\n        <li>数据库：广州主节点 + 上海只读副本（CDB 支持只读实例）</li>\n        <li>Redis：广州主节点 + 上海 Redis 主从</li>\n        <li>文件：COS 跨区复制实时同步</li>\n        <li>服务器：CLB 后挂广州+上海两台 CVM</li>\n      </ul>\n      <p>故障时：DNS 切换到上海节点，预计 30-60 分钟。</p>\n    </div>\n  </div>\n  <div class=\"warn\">\n    <strong>不要忽视 VOD 的备份。</strong>视频文件存的是原始课程内容，VOD 默认 3 副本，但这是腾讯云机房级别的防护。如果需要更高的视频内容安全，建议开启 VOD 的媒资管理锁定功能，防止误删。\n  </div>\n</div>\n\n<!-- 数据库运维 -->\n<div class=\"card\">\n  <h2>10.4 数据库运维：性能问题的根源</h2>\n\n  <h3>10.4.1 常见性能问题及解决</h3>\n  <table>\n    <tr><th>问题现象</th><th>可能原因</th><th>排查方法</th><th>解决方案</th></tr>\n    <tr><td>网站打开慢</td><td>慢查询过多</td><td>开启 MySQL 慢查询日志（&gt;1s）</td><td>优化 SQL + 加索引</td></tr>\n    <tr><td>登录超时</td><td>Redis 连接数满</td><td>查看 Redis INFO 连接数</td><td>增加 maxclients 配置</td></tr>\n    <tr><td>视频加载慢</td><td>CDN 命中率低 / 回源慢</td><td>看 CDN 控制台命中率</td><td>预热热门视频 + 优化回源</td></tr>\n    <tr><td>直播卡顿</td><td>CSS 带宽不足 / 用户端网络</td><td>CSS 控制台看并发峰值</td><td>升配 CSS 套餐 + 降码率</td></tr>\n    <tr><td>数据库连接失败</td><td>连接数超 max_connections</td><td>SHOW PROCESSLIST</td><td>连接池复用 + 升配</td></tr>\n    <tr><td>磁盘满了</td><td>日志文件过大 / 备份文件堆积</td><td>df -h 查看</td><td>清理日志 + 扩磁盘</td></tr>\n  </table>\n\n  <h3>10.4.2 定期维护任务（建议写成自动脚本）</h3>\n  <table>\n    <tr><th>频率</th><th>任务</th><th>操作</th></tr>\n    <tr><td>每天</td><td>数据库备份检查</td><td>确认昨日备份文件存在且大小正常</td></tr>\n    <tr><td>每天</td><td>日志清理</td><td>清理 7 天前的应用日志（避免磁盘满）</td></tr>\n    <tr><td>每周</td><td>慢查询分析</td><td>导出 MySQL 慢查询日志，优化 TOP 3 SQL</td></tr>\n    <tr><td>每周</td><td>SSL 证书检查</td><td>确认证书有效期 &gt; 30 天，Let's Encrypt 会自动续期但要确认</td></tr>\n    <tr><td>每月</td><td>CDN 带宽报告</td><td>分析流量峰值和来源，提前预估下月带宽</td></tr>\n    <tr><td>每月</td><td>安全补丁</td><td>检查服务器安全补丁，腾讯云 CVM 可一键更新</td></tr>\n    <tr><td>每季度</td><td>备份恢复演练</td><td>从备份文件恢复到一个测试环境，验证数据完整性</td></tr>\n  </table>\n\n  <h3>10.4.3 连接池配置建议</h3>\n  <p>后端用 Go/Java/Node.js 连接 MySQL，一定要用连接池，不要每次请求新开连接。推荐配置：</p>\n  <ul>\n    <li><strong>最大连接数：</strong>max_connections = 200~500（根据 CVM 规格定）</li>\n    <li><strong>连接超时：</strong>wait_timeout = 28800（8小时），避免大量空连接</li>\n    <li><strong>连接池大小：</strong>Go: golang.org/x/sync/errgroup 并发控制；Node: pool = 10-50 个连接</li>\n    <li><strong>Redis 连接池：</strong>建议 maxclients = 10000+，单个 Redis 实例足够</li>\n  </ul>\n</div>\n\n<!-- 故障应急 -->\n<div class=\"card\">\n  <h2>10.5 故障应急响应机制</h2>\n\n  <h3>10.5.1 故障分级与响应时效</h3>\n  <table>\n    <tr><th>等级</th><th>定义</th><th>响应时间</th><th>处理时效</th><th>通知范围</th></tr>\n    <tr><td><span class=\"bdg bdg-r\">P0</span>事故</td><td>网站完全无法访问，核心功能（登录/看课/支付）全挂</td><td>5 分钟内</td><td>1 小时内恢复或降级</td><td>全员电话/短信</td></tr>\n    <tr><td><span class=\"bdg bdg-y\">P1</span>故障</td><td>部分功能失效（如视频无法播放、搜索异常）</td><td>15 分钟内</td><td>4 小时内恢复</td><td>技术负责人 + 社长</td></tr>\n    <tr><td><span class=\"bdg bdg-b\">P2</span>异常</td><td>非核心接口报错、性能下降，不影响主流程</td><td>2 小时内</td><td>24 小时内处理</td><td>技术团队群</td></tr>\n  </table>\n\n  <h3>10.5.2 常见故障处理手册</h3>\n\n  <h4>故障1：CVM 服务器挂了（最常见）</h4>\n  <div class=\"step\">\n    <div class=\"step-n\">1</div><div class=\"step-text\">登录腾讯云控制台，确认是 CVM 问题还是网络问题</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">2</div><div class=\"step-text\">如果是 CVM 本身挂了，重启服务器（控制台一键重启）</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">3</div><div class=\"step-text\">如果重启无效，创建新 CVM，从快照恢复（预计 30 分钟）</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">4</div><div class=\"step-text\">切换 CLB 权重，将流量切到备用服务器</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">5</div><div class=\"step-text\">事后写故障报告，分析原因，制定预防措施</div>\n  </div>\n\n  <h4>故障2：MySQL 数据库挂了</h4>\n  <div class=\"step\">\n    <div class=\"step-n\">1</div><div class=\"step-text\">检查腾讯云 MySQL 控制台，看是实例挂了还是连接异常</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">2</div><div class=\"step-text\">实例本身问题：在控制台执行\"实例切换\"（腾讯云会自动选一个备机切换）</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">3</div><div class=\"step-text\">从备份恢复：到 COS 拉最近的全量备份，在新实例恢复（预计 30-60 分钟）</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">4</div><div class=\"step-text\">数据库恢复期间：网站降级为\"只读模式\"（关闭写操作）</div>\n  </div>\n\n  <h4>故障3：视频无法播放（VOD 服务异常）</h4>\n  <div class=\"step\">\n    <div class=\"step-n\">1</div><div class=\"step-text\">登录 VOD 控制台，看视频文件状态是否正常</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">2</div><div class=\"step-text\">如果是转码队列堆积，等待转码完成（可提工单加速）</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">3</div><div class=\"step-text\">如果是 CDN 回源失败，切换视频播放源（flv.js 降级到 HLS）</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">4</div><div class=\"step-text\">联系腾讯云 VOD 客服，提工单，说明视频 FileID，请求紧急处理</div>\n  </div>\n\n  <h4>故障4：直播中断（CSS 服务异常）</h4>\n  <div class=\"step\">\n    <div class=\"step-n\">1</div><div class=\"step-text\">确认是推流端问题还是 CSS 平台问题（看其他直播流是否正常）</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">2</div><div class=\"step-text\">推流端问题：联系主播，检查 OBS 设置，协助重新推流</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">3</div><div class=\"step-text\">CSS 平台问题：提工单，同时告知用户改期或用备用方案（录播）</div>\n  </div>\n\n  <h3>10.5.3 降级策略（必备）</h3>\n  <p>故障时不要硬扛，要有\n<p style=\"color:#999;text-align:center;padding:20px\">[内容已截断，原文件见 /小动物科研培训平台/ ]</p></div>", "icon": "🛠️"}, {"num": 11, "title": "团队协作", "html": "<div class=\"wrap\">\n\n<!-- 报头 -->\n<div class=\"hdr\">\n  <div class=\"sub\"><span class=\"tag\">附加文档</span>村口情报社 · 2026年3月26日</div>\n  <h1>团队协作指南 — GitHub 最佳实践</h1>\n  <div class=\"sub\">小动物科研培训网站 · 前后端分工 · 代码Review · 测试策略 · CI/CD</div>\n</div>\n\n<!-- 01 团队分工 -->\n<div class=\"card\">\n  <h2>01 团队分工方案</h2>\n\n  <h3>方案A：小团队（3-4人，推荐）</h3>\n  <table>\n    <tr><th>角色</th><th>负责人</th><th>职责范围</th></tr>\n    <tr><td>前端</td><td>1人</td><td>Next.js 前端页面、播放器、视频交互、响应式适配</td></tr>\n    <tr><td>后端</td><td>1-2人</td><td>NestJS API、设备码逻辑、支付、直播、RAG接口预留</td></tr>\n    <tr><td>全栈/统筹</td><td>社长</td><td>架构决策 + 业务逻辑把控 + 最终 review</td></tr>\n  </table>\n\n  <h3>方案B：4-5人（更细分）</h3>\n  <table>\n    <tr><th>角色</th><th>职责范围</th></tr>\n    <tr><td>前端开发</td><td>Next.js + 视频播放器 + 页面交互</td></tr>\n    <tr><td>后端开发</td><td>API + 数据库 + 支付 + 设备码逻辑</td></tr>\n    <tr><td>运维/DevOps</td><td>CI/CD + 腾讯云部署 + 监控 + 备份</td></tr>\n    <tr><td>产品/测试</td><td>业务测试 + 验收 + 文档</td></tr>\n  </table>\n\n  <div class=\"info\">\n    <strong>建议：</strong>初期 3 人足够（前端1 + 后端1 + 社长统筹），不必要更多人。更多人意味着更多沟通成本，反而降低效率。\n  </div>\n</div>\n\n<!-- 02 分支管理 -->\n<div class=\"card\">\n  <h2>02 GitHub 分支管理策略</h2>\n\n  <h3>推荐：GitHub Flow（适合小团队）</h3>\n  <div class=\"branch-box\">\n    <div><span class=\"b-main\">main</span>（生产环境，永远是稳定代码）</div>\n    <div style=\"margin-left:20px;\">└── <span class=\"b-dev\">dev</span>（开发主分支，集成所有人代码）</div>\n    <div style=\"margin-left:40px;\">├── <span class=\"b-feat\">feature/device-code-bind</span></div>\n    <div style=\"margin-left:40px;\">├── <span class=\"b-feat\">feature/video-player</span></div>\n    <div style=\"margin-left:40px;\">├── <span class=\"b-feat\">feature/payment</span></div>\n    <div style=\"margin-left:40px;\">└── <span class=\"b-fix\">fix/video-crash</span></div>\n  </div>\n\n  <h3>实际操作流程（每日开发循环）</h3>\n  <div class=\"step\">\n    <div class=\"step-n\">1</div>\n    <div class=\"step-text\">从 dev 新建功能分支：<code>git checkout -b feature/device-code-bind</code></div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">2</div>\n    <div class=\"step-text\">日常开发（每天至少 push 一次）：<br>\n    <code>git add . && git commit -m \"feat: 设备码绑定API设计\" && git push</code></div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">3</div>\n    <div class=\"step-text\">完成后提 Pull Request（PR），指定 1 人 review，社长合并</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">4</div>\n    <div class=\"step-text\">Review 通过后，merge 到 dev，自动触发 CI（测试 + 构建）</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">5</div>\n    <div class=\"step-text\">dev 稳定后，merge 到 main，自动触发生产部署</div>\n  </div>\n\n  <h3>分支命名规范</h3>\n  <table>\n    <tr><th>前缀</th><th>用途</th><th>示例</th></tr>\n    <tr><td><code>feature/</code></td><td>新功能</td><td><code>feature/device-code-bind</code></td></tr>\n    <tr><td><code>fix/</code></td><td>Bug修复</td><td><code>fix/video-player-crash</code></td></tr>\n    <tr><td><code>refactor/</code></td><td>代码重构</td><td><code>refactor/payment-module</code></td></tr>\n    <tr><td><code>docs/</code></td><td>文档更新</td><td><code>docs/api-docs</code></td></tr>\n    <tr><td><code>test/</code></td><td>测试代码</td><td><code>test/rbac-permission</code></td></tr>\n  </table>\n</div>\n\n<!-- 03 Code Review -->\n<div class=\"card\">\n  <h2>03 代码 Review 规范</h2>\n\n  <h3>核心规则</h3>\n  <table>\n    <tr><th>规则</th><th>说明</th></tr>\n    <tr><td><span class=\"bdg bdg-r\">强制</span>全部 review</td><td>所有代码必须有人看过才能合并，不能直接 push 到 dev/main</td></tr>\n    <tr><td><span class=\"bdg bdg-y\">PR 大小</span></td><td>一个 PR 不超过 400 行改动，超过就拆成多个</td></tr>\n    <tr><td><span class=\"bdg bdg-y\">Review 重点</span></td><td>逻辑是否正确、有没有明显 Bug、安全问题</td></tr>\n    <tr><td><span class=\"bdg bdg-b\">时间要求</span></td><td>24 小时内必须给反馈，否则自动催办</td></tr>\n  </table>\n\n  <h3>Review 清单（每次 review 必须回答）</h3>\n  <div class=\"r2\">\n    <div>\n      <ul>\n        <li>□ 功能逻辑对不对？</li>\n        <li>□ 有没有明显的 Bug？</li>\n        <li>□ 数据库操作是否安全（防 SQL 注入）？</li>\n      </ul>\n    </div>\n    <div>\n      <ul>\n        <li>□ 错误处理有没有？</li>\n        <li>□ 测试用例有没有（重要功能必须补）？</li>\n        <li>□ 日志是否充分（出问题能追查）？</li>\n      </ul>\n    </div>\n  </div>\n\n  <h3>PR 描述模板（必须填写）</h3>\n<pre>## 改动内容\n- 实现了设备码绑定功能\n- 新增了 US/IC/MX 三种前缀的权限判断\n\n## 改动原因\n- PRD 要求 Phase 1 必须完成设备码绑定\n\n## 测试情况\n- [x] 单元测试通过（checkDevicePermission 3个用例）\n- [x] API 集成测试通过\n- [x] 本地手动验证通过\n\n## 关联 Issue\nCloses #12\n</pre>\n</div>\n\n<!-- 04 测试策略 -->\n<div class=\"card\">\n  <h2>04 测试策略</h2>\n\n  <h3>测试金字塔</h3>\n  <div class=\"pyramid\">\n    <div class=\"pyra\">\n      <div class=\"pyra-bar\" style=\"width:35%; background:#c62828;\">E2E 测试</div>\n      <div class=\"pyra-label\">Playwright</div>\n      <div class=\"pyra-cost\">成本最高</div>\n    </div>\n    <div class=\"pyra\">\n      <div class=\"pyra-bar\" style=\"width:55%; background:#f57f17;\">集成测试（API）</div>\n      <div class=\"pyra-label\">Jest + Supertest</div>\n      <div class=\"pyra-cost\">中等</div>\n    </div>\n    <div class=\"pyra\">\n      <div class=\"pyra-bar\" style=\"width:80%; background:#2e7d32;\">单元测试</div>\n      <div class=\"pyra-label\">Jest / Vitest</div>\n      <div class=\"pyra-cost\">成本最低</div>\n    </div>\n  </div>\n\n  <h3>测试矩阵</h3>\n  <table>\n    <tr><th>测试类型</th><th>工具</th><th>覆盖要求</th><th>执行频率</th></tr>\n    <tr><td>单元测试</td><td>Jest（后端）、Vitest（前端）</td><td>核心工具函数、业务逻辑必须写</td><td>每次 push 触发</td></tr>\n    <tr><td>API 集成测试</td><td>Jest + Supertest</td><td>所有 API 接口必须有测试用例</td><td>每次 push 触发</td></tr>\n    <tr><td>E2E 测试</td><td>Playwright</td><td>登录、注册、设备码绑定、购买流程</td><td>合并前必须跑通</td></tr>\n    <tr><td>手动测试</td><td>—</td><td>上线前产品/社长验收</td><td>上线前</td></tr>\n  </table>\n\n  <h3>前端必须测试的场景（示例）</h3>\n<pre>// Vitest 示例\n<span class=\"f\">test</span>(<span class=\"s\">'设备码格式校验'</span>, () => {\n  expect(<span class=\"f\">validateCode</span>(<span class=\"s\">'US-ABCD-1234'</span>)).toBe(<span class=\"k\">true</span>);\n  expect(<span class=\"f\">validateCode</span>(<span class=\"s\">'XX-ABCD-1234'</span>)).toBe(<span class=\"k\">false</span>);\n  expect(<span class=\"f\">validateCode</span>(<span class=\"s\">'US-1234'</span>)).toBe(<span class=\"k\">false</span>);\n});\n\n<span class=\"f\">test</span>(<span class=\"s\">'游客无法访问付费课程'</span>, () => {\n  <span class=\"k\">const</span> result = <span class=\"f\">checkAccess</span>({ role: <span class=\"s\">'guest'</span>, courseId: <span class=\"s\">'xxx'</span> });\n  expect(result.canAccess).toBe(<span class=\"k\">false</span>);\n});\n</pre>\n\n  <h3>后端必须测试的场景（示例）</h3>\n<pre>// Jest 示例\n<span class=\"f\">test</span>(<span class=\"s\">'US前缀设备码应解锁超声课程'</span>, () => {\n  <span class=\"k\">const</span> result = <span class=\"f\">checkDevicePermission</span>(<span class=\"s\">'US-XXXX-YYYY'</span>, <span class=\"s\">'ultrasound-course-01'</span>);\n  expect(result.granted).toBe(<span class=\"k\">true</span>);\n});\n\n<span class=\"f\">test</span>(<span class=\"s\">'MX前缀设备码应同时解锁超声和智能笼课程'</span>, () => {\n  <span class=\"k\">const</span> result = <span class=\"f\">checkDevicePermission</span>(<span class=\"s\">'MX-XXXX-YYYY'</span>, <span class=\"s\">'smartcage-course-01'</span>);\n  expect(result.granted).toBe(<span class=\"k\">true</span>);\n});\n\n<span class=\"f\">test</span>(<span class=\"s\">'无设备码用户不能访问付费内容'</span>, () => {\n  <span class=\"k\">const</span> result = <span class=\"f\">checkDevicePermission</span>(<span class=\"k\">null</span>, <span class=\"s\">'paid-course'</span>);\n  expect(result.granted).toBe(<span class=\"k\">false</span>);\n});\n</pre>\n\n  <h3>关键 E2E 测试流程（Playwright）</h3>\n  <div class=\"step\">\n    <div class=\"step-n\">1</div>\n    <div class=\"step-text\">注册 → 登录 → 设备码绑定 → 购买课程 → 看课 → 退出</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">2</div>\n    <div class=\"step-text\">游客访问付费课程页面 → 提示登录或购买</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">3</div>\n    <div class=\"step-text\">错误设备码（XX前缀）→ 提示无效码</div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-n\">4</div>\n    <div class=\"step-text\">US设备码 → 解锁超声课程，但看不到智能笼课程</div>\n  </div>\n</div>\n\n<!-- 05 CI/CD -->\n<div class=\"card\">\n  <h2>05 CI/CD 流水线（GitHub Actions）</h2>\n\n  <h3>核心原则</h3>\n  <div class=\"ok\">\n    <strong>不跑通测试，不让合并。</strong>所有 push 到 dev/main 的代码，CI 必须全部变绿才能合并。\n  </div>\n\n  <h3>CI 配置文件</h3>\n<pre><span class=\"c\"># .github/workflows/ci.yml</span>\n<span class=\"k\">name:</span> CI\n\n<span class=\"k\">on:</span>\n  <span class=\"f\">push:</span>\n    branches: [dev, main]\n  <span class=\"f\">pull_request:</span>\n    branches: [dev, main]\n\n<span class=\"k\">jobs:</span>\n  <span class=\"f\">test:</span>\n    <span class=\"f\">runs-on:</span> ubuntu-latest\n    <span class=\"f\">steps:</span>\n      - <span class=\"f\">uses:</span> actions/checkout@v4\n\n      <span class=\"c\"># Node.js 环境</span>\n      - <span class=\"f\">uses:</span> actions/setup-node@v4\n        <span class=\"f\">with:</span>\n          <span class=\"f\">node-version:</span> <span class=\"s\">'20'</span>\n\n      <span class=\"c\"># 后端测试</span>\n      - <span class=\"f\">name:</span> Backend Tests\n        <span class=\"f\">run:</span> |\n          <span class=\"k\">cd</span> backend\n          <span class=\"f\">npm ci</span>\n          <span class=\"f\">npm run test</span>        <span class=\"c\"># 单元测试</span>\n          <span class=\"f\">npm run test:e2e</span>   <span class=\"c\"># API集成测试</span>\n\n      <span class=\"c\"># 前端测试</span>\n      - <span class=\"f\">name:</span> Frontend Tests\n        <span class=\"f\">run:</span> |\n          <span class=\"k\">cd</span> frontend\n          <span class=\"f\">npm ci</span>\n          <span class=\"f\">npm run test</span>        <span class=\"c\"># Vitest单元测试</span>\n          <span class=\"f\">npm run build</span>       <span class=\"c\"># 构建测试</span>\n\n  <span class=\"f\">deploy:</span>\n    <span class=\"f\">needs:</span> test\n    <span class=\"f\">if:</span> github.ref == <span class=\"s\">'refs/heads/main'</span>\n    <span class=\"f\">runs-on:</span> ubuntu-latest\n    <span class=\"f\">steps:</span>\n      - <span class=\"f\">name:</span> Deploy to Tencent Cloud\n        <span class=\"f\">run:</span> |\n          <span class=\"c\"># 部署脚本：构建镜像 → 推送 → 更新TKE</span>\n          ./<span class=\"f\">deploy.sh</span> production\n</pre>\n\n  <h3>部署架构</h3>\n  <div style=\"text-align:center; margin: 16px 0; font-fa
